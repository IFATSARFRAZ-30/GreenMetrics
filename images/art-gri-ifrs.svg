<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Illustration: GRI and IFRS S1/S2 as overlapping lenses">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c3326"/><stop offset="1" stop-color="#1f7a50"/></linearGradient>
<radialGradient id="glow" cx=".78" cy=".15" r=".65"><stop offset="0" stop-color="#8ee8b0" stop-opacity=".5"/><stop offset="1" stop-color="#8ee8b0" stop-opacity="0"/></radialGradient>
<radialGradient id="glow2" cx=".1" cy=".95" r=".6"><stop offset="0" stop-color="#f2c14e" stop-opacity=".22"/><stop offset="1" stop-color="#f2c14e" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#fff" opacity=".13"/></pattern>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#021a12" flood-opacity=".45"/></filter>
<g id="leaf"><path d="M0 0C-62 -42 -52 -124 0 -156C52 -124 62 -42 0 0Z"/><path d="M0 0V-132" fill="none" stroke="#0c3326" stroke-opacity=".35" stroke-width="3"/></g>
</defs>
<style>
text{font-family:ui-monospace,Menlo,Consolas,monospace}
.sway{animation:sway 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.sway2{animation:sway 9s ease-in-out -3s infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{rotate:-3deg}50%{rotate:4deg}}
.fl{animation:fl 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes fl{0%,100%{translate:0 0}50%{translate:0 -10px}}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{scale:1}50%{scale:1.16}}
.tw{animation:tw 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{opacity:.2;scale:.6}50%{opacity:1;scale:1}}
.c1{animation:c1 7s ease-in-out infinite}.c2{animation:c2 7s ease-in-out infinite}@keyframes c1{0%,100%{translate:0 0}50%{translate:-26px 0}}@keyframes c2{0%,100%{translate:0 0}50%{translate:26px 0}}
</style>
<rect width="800" height="500" fill="url(#bg)"/>
<rect width="800" height="500" fill="url(#dots)"/>
<rect width="800" height="500" fill="url(#glow)"/>
<rect width="800" height="500" fill="url(#glow2)"/>
<use href="#leaf" fill="#3fa863" opacity=".16" transform="translate(40 520) rotate(-18) scale(1.7)" class="sway"/>
<use href="#leaf" fill="#8ee8b0" opacity=".12" transform="translate(790 520) rotate(22) scale(1.4)" class="sway2"/>

<g class="c1"><circle cx="318" cy="250" r="138" fill="#3fa863" fill-opacity=".72" stroke="#dff1e3" stroke-width="3"/></g>
<g class="c2"><circle cx="482" cy="250" r="138" fill="#f2c14e" fill-opacity=".62" stroke="#fff4d4" stroke-width="3"/></g>
<text x="250" y="244" text-anchor="middle" font-size="44" font-weight="900" fill="#fbfdfb">GRI</text><text x="250" y="272" text-anchor="middle" font-size="15" font-weight="700" fill="#dff1e3">impact</text>
<text x="552" y="236" text-anchor="middle" font-size="40" font-weight="900" fill="#0f3d2e">IFRS</text><text x="552" y="262" text-anchor="middle" font-size="22" font-weight="800" fill="#0f3d2e">S1/S2</text><text x="552" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#4a3a0c">enterprise value</text>
<g class="pulse"><rect x="366" y="224" width="68" height="52" rx="26" fill="#fbfdfb"/><text x="400" y="256" text-anchor="middle" font-size="17" font-weight="800" fill="#0f3d2e">both</text></g>
<g transform="translate(400 70)" class="fl"><path d="M-70 0 H70" stroke="#a8dcc0" stroke-width="5" stroke-linecap="round"/><path d="M0 0 V-30" stroke="#a8dcc0" stroke-width="5"/><circle cx="-70" cy="22" r="14" fill="#3fa863"/><circle cx="70" cy="22" r="14" fill="#f2c14e"/></g>
<path class="tw" style="animation-delay:0s" d="M100 109.2L103.0 117.0L110.8 120L103.0 123.0L100 130.8L97.0 123.0L89.2 120L97.0 117.0Z" fill="#f2c14e"/><path class="tw" style="animation-delay:1.1s" d="M700 390.1L702.75 397.25L709.9 400L702.75 402.75L700 409.9L697.25 402.75L690.1 400L697.25 397.25Z" fill="#f2c14e"/><path class="tw" style="animation-delay:2s" d="M120 402.8L122.0 408.0L127.2 410L122.0 412.0L120 417.2L118.0 412.0L112.8 410L118.0 408.0Z" fill="#f2c14e"/>
</svg>
