<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Illustration: a CBAM and CSRD readiness checklist beside a container ship">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c3326"/><stop offset="1" stop-color="#1f7a50"/></linearGradient>
<radialGradient id="glow" cx=".78" cy=".15" r=".65"><stop offset="0" stop-color="#8ee8b0" stop-opacity=".5"/><stop offset="1" stop-color="#8ee8b0" stop-opacity="0"/></radialGradient>
<radialGradient id="glow2" cx=".1" cy=".95" r=".6"><stop offset="0" stop-color="#f2c14e" stop-opacity=".22"/><stop offset="1" stop-color="#f2c14e" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#fff" opacity=".13"/></pattern>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#021a12" flood-opacity=".45"/></filter>
<g id="leaf"><path d="M0 0C-62 -42 -52 -124 0 -156C52 -124 62 -42 0 0Z"/><path d="M0 0V-132" fill="none" stroke="#0c3326" stroke-opacity=".35" stroke-width="3"/></g>
</defs>
<style>
text{font-family:ui-monospace,Menlo,Consolas,monospace}
.sway{animation:sway 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.sway2{animation:sway 9s ease-in-out -3s infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{rotate:-3deg}50%{rotate:4deg}}
.fl{animation:fl 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes fl{0%,100%{translate:0 0}50%{translate:0 -10px}}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{scale:1}50%{scale:1.16}}
.tw{animation:tw 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{opacity:.2;scale:.6}50%{opacity:1;scale:1}}
.t0{stroke-dasharray:28;stroke-dashoffset:28;animation:tk 7.5s ease-in-out 0.0s infinite}.t1{stroke-dasharray:28;stroke-dashoffset:28;animation:tk 7.5s ease-in-out 0.5s infinite}.t2{stroke-dasharray:28;stroke-dashoffset:28;animation:tk 7.5s ease-in-out 1.0s infinite}.t3{stroke-dasharray:28;stroke-dashoffset:28;animation:tk 7.5s ease-in-out 1.5s infinite}.t4{stroke-dasharray:28;stroke-dashoffset:28;animation:tk 7.5s ease-in-out 2.0s infinite}.t5{stroke-dasharray:28;stroke-dashoffset:28;animation:tk 7.5s ease-in-out 2.5s infinite}.t6{stroke-dasharray:28;stroke-dashoffset:28;animation:tk 7.5s ease-in-out 3.0s infinite}@keyframes tk{0%{stroke-dashoffset:28}8%,78%{stroke-dashoffset:0}90%,100%{stroke-dashoffset:28}}.wave{animation:wv 3.4s linear infinite}@keyframes wv{to{translate:-80px 0}}.ship{animation:sh 5s ease-in-out infinite}@keyframes sh{0%,100%{translate:0 0;rotate:-.6deg}50%{translate:0 -6px;rotate:.8deg}}
</style>
<rect width="800" height="500" fill="url(#bg)"/>
<rect width="800" height="500" fill="url(#dots)"/>
<rect width="800" height="500" fill="url(#glow)"/>
<rect width="800" height="500" fill="url(#glow2)"/>
<use href="#leaf" fill="#3fa863" opacity=".16" transform="translate(40 520) rotate(-18) scale(1.7)" class="sway"/>
<use href="#leaf" fill="#8ee8b0" opacity=".12" transform="translate(790 520) rotate(22) scale(1.4)" class="sway2"/>

<g filter="url(#sh)"><rect x="140" y="60" width="290" height="372" rx="18" fill="#fbfdfb"/><rect x="214" y="44" width="142" height="40" rx="12" fill="#0f3d2e"/><circle cx="285" cy="64" r="7" fill="#a8dcc0"/><rect x="168" y="108" width="24" height="24" rx="6" fill="#fff" stroke="#2f8a4f" stroke-width="2.5"/><path class="t0" d="M173 120 l5 6 l10 -13" fill="none" stroke="#2f8a4f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="208" y="126" font-size="14" font-weight="700" fill="#0f3d2e">Scope check</text><rect x="168" y="148" width="24" height="24" rx="6" fill="#fff" stroke="#2f8a4f" stroke-width="2.5"/><path class="t1" d="M173 160 l5 6 l10 -13" fill="none" stroke="#2f8a4f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="208" y="166" font-size="14" font-weight="700" fill="#0f3d2e">EU buyers listed</text><rect x="168" y="188" width="24" height="24" rx="6" fill="#fff" stroke="#2f8a4f" stroke-width="2.5"/><path class="t2" d="M173 200 l5 6 l10 -13" fill="none" stroke="#2f8a4f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="208" y="206" font-size="14" font-weight="700" fill="#0f3d2e">Value-chain cap</text><rect x="168" y="228" width="24" height="24" rx="6" fill="#fff" stroke="#2f8a4f" stroke-width="2.5"/><path class="t3" d="M173 240 l5 6 l10 -13" fill="none" stroke="#2f8a4f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="208" y="246" font-size="14" font-weight="700" fill="#0f3d2e">Data owners named</text><rect x="168" y="268" width="24" height="24" rx="6" fill="#fff" stroke="#2f8a4f" stroke-width="2.5"/><path class="t4" d="M173 280 l5 6 l10 -13" fill="none" stroke="#2f8a4f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="208" y="286" font-size="14" font-weight="700" fill="#0f3d2e">Emissions data</text><rect x="168" y="308" width="24" height="24" rx="6" fill="#fff" stroke="#2f8a4f" stroke-width="2.5"/><path class="t5" d="M173 320 l5 6 l10 -13" fill="none" stroke="#2f8a4f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="208" y="326" font-size="14" font-weight="700" fill="#0f3d2e">Evidence file</text><rect x="168" y="348" width="24" height="24" rx="6" fill="#fff" stroke="#2f8a4f" stroke-width="2.5"/><path class="t6" d="M173 360 l5 6 l10 -13" fill="none" stroke="#2f8a4f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="208" y="366" font-size="14" font-weight="700" fill="#0f3d2e">Response protocol</text></g>
<g class="ship"><path d="M470 380 H730 L704 424 H500 Z" fill="#0f3d2e" stroke="#a8dcc0" stroke-width="3"/><rect x="500" y="352" width="46" height="26" rx="3" fill="#f2c14e"/><path d="M506 352 v26 M516 352 v26 M526 352 v26" stroke="#0f3d2e" stroke-opacity=".25" stroke-width="2"/><rect x="550" y="352" width="46" height="26" rx="3" fill="#3fa863"/><path d="M556 352 v26 M566 352 v26 M576 352 v26" stroke="#0f3d2e" stroke-opacity=".25" stroke-width="2"/><rect x="600" y="352" width="46" height="26" rx="3" fill="#a8dcc0"/><path d="M606 352 v26 M616 352 v26 M626 352 v26" stroke="#0f3d2e" stroke-opacity=".25" stroke-width="2"/><rect x="500" y="322" width="46" height="26" rx="3" fill="#fbfdfb"/><path d="M506 322 v26 M516 322 v26 M526 322 v26" stroke="#0f3d2e" stroke-opacity=".25" stroke-width="2"/><rect x="550" y="322" width="46" height="26" rx="3" fill="#f2c14e"/><path d="M556 322 v26 M566 322 v26 M576 322 v26" stroke="#0f3d2e" stroke-opacity=".25" stroke-width="2"/><rect x="600" y="322" width="46" height="26" rx="3" fill="#3fa863"/><path d="M606 322 v26 M616 322 v26 M626 322 v26" stroke="#0f3d2e" stroke-opacity=".25" stroke-width="2"/><rect x="662" y="318" width="52" height="62" rx="4" fill="#dff1e3"/><rect x="672" y="328" width="12" height="12" fill="#0f3d2e"/><rect x="692" y="328" width="12" height="12" fill="#0f3d2e"/><rect x="676" y="296" width="24" height="22" rx="3" fill="#a8dcc0"/></g>
<g opacity=".9"><g class="wave"><path d="M440 436 q20 -14 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" fill="none" stroke="#a8dcc0" stroke-width="5" stroke-linecap="round"/></g></g>
<g transform="translate(646 120)" class="fl"><circle r="46" fill="#f2c14e"/><text y="-2" text-anchor="middle" font-size="26" font-weight="900" fill="#0f3d2e">CBAM</text><text y="22" text-anchor="middle" font-size="13" font-weight="800" fill="#0f3d2e">+ CSRD</text></g>
<path class="tw" style="animation-delay:0.5s" d="M500 191L502.5 197.5L509 200L502.5 202.5L500 209L497.5 202.5L491 200L497.5 197.5Z" fill="#f2c14e"/><path class="tw" style="animation-delay:1.4s" d="M760 221.9L762.25 227.75L768.1 230L762.25 232.25L760 238.1L757.75 232.25L751.9 230L757.75 227.75Z" fill="#f2c14e"/>

</svg>
