="3"/><text class="m9" x="668.0" y="203.2" text-anchor="middle" font-size="13" font-weight="900" fill="#dff1e3">10</text>
<g class="fl" transform="translate(190 120)"><path d="M0 -42 L98 0 L0 42 L-98 0Z" fill="#fbfdfb"/><path d="M-58 22 V62 Q0 92 58 62 V22 L0 44Z" fill="#dff1e3"/><path d="M92 4 V64" stroke="#f2c14e" stroke-width="5" stroke-linecap="round"/><circle cx="92" cy="70" r="8" fill="#f2c14e"/></g>
<g class="fl" style="animation-delay:-2s" filter="url(#sh)"><rect x="548" y="334" width="196" height="116" rx="12" fill="#fbfdfb"/><rect x="560" y="346" width="172" height="92" rx="7" fill="none" stroke="#2f8a4f" stroke-width="2" stroke-dasharray="5 5"/>
<text x="646" y="378" text-anchor="middle" font-size="13" font-weight="900" fill="#0f3d2e" letter-spacing="2">CERTIFICATE</text><text x="646" y="412" text-anchor="middle" font-size="26" font-weight="900" fill="#2f8a4f">70%+</text>
<circle cx="716" cy="438" r="19" fill="#f2c14e"/><path d="M706 452 l-6 22 l16 -9 l16 9 l-6 -22" fill="#e8553f" transform="translate(-6 -4)"/></g>
<path class="tw" style="animation-delay:0s" d="M660 78.3L663.25 86.75L671.7 90L663.25 93.25L660 101.7L656.75 93.25L648.3 90L656.75 86.75Z" fill="#f2c14e"/><path class="tw" style="animation-delay:1s" d="M90 431L92.5 437.5L99 440L92.5 442.5L90 449L87.5 442.5L81 440L87.5 437.5Z" fill="#f2c14e"/><path class="tw" style="animation-delay:1.8s" d="M430 61.9L432.25 67.75L438.1 70L432.25 72.25L430 78.1L427.75 72.25L421.9 70L427.75 67.75Z" fill="#f2c14e"/>

</svg>
