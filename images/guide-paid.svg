<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Illustration: a locked template pack, in preparation">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c3326"/><stop offset="1" stop-color="#1f7a50"/></linearGradient>
<radialGradient id="glow" cx=".78" cy=".15" r=".65"><stop offset="0" stop-color="#8ee8b0" stop-opacity=".5"/><stop offset="1" stop-color="#8ee8b0" stop-opacity="0"/></radialGradient>
<radialGradient id="glow2" cx=".1" cy=".95" r=".6"><stop offset="0" stop-color="#f2c14e" stop-opacity=".22"/><stop offset="1" stop-color="#f2c14e" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#fff" opacity=".13"/></pattern>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#021a12" flood-opacity=".45"/></filter>
<g id="leaf"><path d="M0 0C-62 -42 -52 -124 0 -156C52 -124 62 -42 0 0Z"/><path d="M0 0V-132" fill="none" stroke="#0c3326" stroke-opacity=".35" stroke-width="3"/></g>
</defs>
<style>
text{font-family:ui-monospace,Menlo,Consolas,monospace}
.sway{animation:sway 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.sway2{animation:sway 9s ease-in-out -3s infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{rotate:-3deg}50%{rotate:4deg}}
.fl{animation:fl 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes fl{0%,100%{translate:0 0}50%{translate:0 -10px}}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{scale:1}50%{scale:1.16}}
.tw{animation:tw 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{opacity:.2;scale:.6}50%{opacity:1;scale:1}}
.shine{animation:shn 4s ease-in-out infinite}@keyframes shn{0%{translate:-120px 0}60%,100%{translate:160px 0}}
</style>
<rect width="800" height="500" fill="url(#bg)"/>
<rect width="800" height="500" fill="url(#dots)"/>
<rect width="800" height="500" fill="url(#glow)"/>
<rect width="800" height="500" fill="url(#glow2)"/>
<use href="#leaf" fill="#3fa863" opacity=".16" transform="translate(40 520) rotate(-18) scale(1.7)" class="sway"/>
<use href="#leaf" fill="#8ee8b0" opacity=".12" transform="translate(790 520) rotate(22) scale(1.4)" class="sway2"/>

<g filter="url(#sh)"><g transform="rotate(-9 300 260)"><rect x="170" y="110" width="250" height="310" rx="14" fill="#a8dcc0"/></g>
<g transform="rotate(6 400 260)"><rect x="275" y="96" width="250" height="320" rx="14" fill="#dff1e3"/></g>
<rect x="228" y="80" width="260" height="340" rx="14" fill="#fbfdfb"/><rect x="228" y="80" width="260" height="54" rx="14" fill="#0f3d2e"/><rect x="228" y="116" width="260" height="18" fill="#0f3d2e"/>
<text x="358" y="115" text-anchor="middle" font-size="17" font-weight="800" fill="#fbfdfb">TEMPLATE PACK</text>
<rect x="254" y="160" width="208" height="9" rx="4.5" fill="#b6cdbb"/><rect x="254" y="184" width="170" height="9" rx="4.5" fill="#b6cdbb"/><rect x="254" y="208" width="190" height="9" rx="4.5" fill="#b6cdbb"/>
<rect x="254" y="244" width="208" height="60" rx="8" fill="#eaf6ee" stroke="#b6cdbb"/></g>
<g filter="url(#sh)" class="fl"><path d="M548 270 v-34 a52 52 0 0 1 104 0 v34" fill="none" stroke="#f2c14e" stroke-width="16" stroke-linecap="round"/><rect x="520" y="262" width="160" height="124" rx="22" fill="#f2c14e"/>
<circle cx="600" cy="316" r="15" fill="#0f3d2e"/><rect x="594" y="320" width="12" height="32" rx="6" fill="#0f3d2e"/>
<clipPath id="cl"><rect x="520" y="262" width="160" height="124" rx="22"/></clipPath><g clip-path="url(#cl)"><rect class="shine" x="540" y="250" width="34" height="150" fill="#fff" opacity=".35" transform="skewX(-20)"/></g></g>
<g transform="translate(230 450)"><rect x="-100" y="-22" width="200" height="38" rx="19" fill="#0f3d2e" stroke="#a8dcc0" stroke-width="2"/><text y="3" text-anchor="middle" font-size="14" font-weight="800" fill="#a8dcc0" letter-spacing="3">IN PREPARATION</text></g>
<path class="tw" style="animation-delay:0s" d="M740 108.3L743.25 116.75L751.7 120L743.25 123.25L740 131.7L736.75 123.25L728.3 120L736.75 116.75Z" fill="#f2c14e"/><path class="tw" style="animation-delay:1s" d="M110 131L112.5 137.5L119 140L112.5 142.5L110 149L107.5 142.5L101 140L107.5 137.5Z" fill="#f2c14e"/><path class="tw" style="animation-delay:1.8s" d="M700 431.9L702.25 437.75L708.1 440L702.25 442.25L700 448.1L697.75 442.25L691.9 440L697.75 437.75Z" fill="#f2c14e"/>
</svg>
