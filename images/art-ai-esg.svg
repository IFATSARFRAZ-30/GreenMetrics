.tw{animation:tw 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{opacity:.2;scale:.6}50%{opacity:1;scale:1}}
.ed line{stroke:#a8dcc0;stroke-opacity:.28;stroke-width:1.6}
</style>
