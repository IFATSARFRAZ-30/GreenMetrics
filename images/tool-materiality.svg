<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Illustration: a materiality matrix with plotted impacts and risks">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c3326"/><stop offset="1" stop-color="#1f7a50"/></linearGradient>
<radialGradient id="glow" cx=".78" cy=".15" r=".65"><stop offset="0" stop-color="#8ee8b0" stop-opacity=".5"/><stop offset="1" stop-color="#8ee8b0" stop-opacity="0"/></radialGradient>
<radialGradient id="glow2" cx=".1" cy=".95" r=".6"><stop offset="0" stop-color="#f2c14e" stop-opacity=".22"/><stop offset="1" stop-color="#f2c14e" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#fff" opacity=".13"/></pattern>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#021a12" flood-opacity=".45"/></filter>
<g id="leaf"><path d="M0 0C-62 -42 -52 -124 0 -156C52 -124 62 -42 0 0Z"/><path d="M0 0V-132" fill="none" stroke="#0c3326" stroke-opacity=".35" stroke-width="3"/></g>
</defs>
<style>
text{font-family:ui-monospace,Menlo,Consolas,monospace}
.sway{animation:sway 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.sway2{animation:sway 9s ease-in-out -3s infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{rotate:-3deg}50%{rotate:4deg}}
.fl{animation:fl 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes fl{0%,100%{translate:0 0}50%{translate:0 -10px}}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{scale:1}50%{scale:1.16}}
.tw{animation:tw 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{opacity:.2;scale:.6}50%{opacity:1;scale:1}}
.dot{animation:dp 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes dp{0%,100%{scale:1}50%{scale:1.35}}.add{animation:ad 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes ad{0%,100%{translate:0 0}50%{translate:0 -8px}}
</style>
<rect width="800" height="500" fill="url(#bg)"/>
<rect width="800" height="500" fill="url(#dots)"/>
<rect width="800" height="500" fill="url(#glow)"/>
<rect width="800" height="500" fill="url(#glow2)"/>
<use href="#leaf" fill="#3fa863" opacity=".16" transform="translate(40 520) rotate(-18) scale(1.7)" class="sway"/>
<use href="#leaf" fill="#8ee8b0" opacity=".12" transform="translate(790 520) rotate(22) scale(1.4)" class="sway2"/>

<g filter="url(#sh)"><rect x="236" y="70" width="380" height="360" rx="18" fill="#fbfdfb" fill-opacity=".1" stroke="#dff1e3" stroke-opacity=".6" stroke-width="2.5"/></g>
<rect x="426" y="80" width="180" height="170" fill="#8ee8b0" fill-opacity=".2"/><path d="M426 80 V420 M246 250 H606" stroke="#dff1e3" stroke-opacity=".7" stroke-width="2.5" stroke-dasharray="7 7"/>
<text x="516" y="104" text-anchor="middle" font-size="14" font-weight="800" fill="#dff1e3" letter-spacing="2">BOTH</text>
<text x="336" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#a8dcc0" letter-spacing="2">GRI</text>
<text x="516" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#a8dcc0" letter-spacing="2">IFRS</text>
<text x="336" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#a8dcc0" letter-spacing="2">NEITHER</text>
<text x="426" y="452" text-anchor="middle" font-size="13" fill="#a8dcc0" letter-spacing="3">IMPACT  &#8594;</text>
<text transform="translate(212 250) rotate(-90)" text-anchor="middle" font-size="13" fill="#a8dcc0" letter-spacing="3">FINANCIAL  &#8594;</text>
<circle class="dot" style="animation-delay:0.0s" cx="510" cy="150" r="15" fill="#f2c14e" stroke="#0f3d2e" stroke-opacity=".35" stroke-width="2"/><circle class="dot" style="animation-delay:0.45s" cx="560" cy="205" r="11" fill="#a8dcc0" stroke="#0f3d2e" stroke-opacity=".35" stroke-width="2"/><circle class="dot" style="animation-delay:0.9s" cx="470" cy="210" r="12" fill="#f2c14e" stroke="#0f3d2e" stroke-opacity=".35" stroke-width="2"/><circle class="dot" style="animation-delay:1.35s" cx="330" cy="140" r="14" fill="#3fa863" stroke="#0f3d2e" stroke-opacity=".35" stroke-width="2"/><circle class="dot" style="animation-delay:1.8s" cx="365" cy="215" r="10" fill="#a8dcc0" stroke="#0f3d2e" stroke-opacity=".35" stroke-width="2"/><circle class="dot" style="animation-delay:2.25s" cx="520" cy="330" r="13" fill="#3fa863" stroke="#0f3d2e" stroke-opacity=".35" stroke-width="2"/><circle class="dot" style="animation-delay:2.7s" cx="330" cy="330" r="10" fill="#dff1e3" stroke="#0f3d2e" stroke-opacity=".35" stroke-width="2"/><circle class="dot" style="animation-delay:3.15s" cx="420" cy="380" r="9" fill="#dff1e3" stroke="#0f3d2e" stroke-opacity=".35" stroke-width="2"/><circle class="dot" style="animation-delay:3.6s" cx="590" cy="380" r="10" fill="#f2c14e" stroke="#0f3d2e" stroke-opacity=".35" stroke-width="2"/>
<g class="add" filter="url(#sh)"><rect x="640" y="316" width="118" height="46" rx="23" fill="#f2c14e"/><text x="699" y="345" text-anchor="middle" font-size="16" font-weight="900" fill="#0f3d2e">+ add row</text></g>
<path class="tw" style="animation-delay:0s" d="M110 99.2L113.0 107.0L120.8 110L113.0 113.0L110 120.8L107.0 113.0L99.2 110L107.0 107.0Z" fill="#f2c14e"/><path class="tw" style="animation-delay:1s" d="M120 371L122.5 377.5L129 380L122.5 382.5L120 389L117.5 382.5L111 380L117.5 377.5Z" fill="#f2c14e"/><path class="tw" style="animation-delay:1.6s" d="M730 101L732.5 107.5L739 110L732.5 112.5L730 119L727.5 112.5L721 110L727.5 107.5Z" fill="#f2c14e"/>

</svg>
