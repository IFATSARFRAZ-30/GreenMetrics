<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A practical beginner's guide to sustainability reporting frameworks — GRI, IFRS S1 and IFRS S2.">
<title>Understanding GRI & IFRS S1/S2 — GreenMetrics Mini-Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --pine:#1B4332; --moss:#2D6A4F; --leaf:#52B788; --mint:#D8F3DC; --mint2:#EAF7EE;
  --paper:#F4F7F4; --card:#FFFFFF; --ink:#1C2A22; --mut:#5C6B62; --line:#DFE8E0;
  --red:#B3261E; --redbg:#FBEDEB; --amber:#92600A; --amberbg:#FFF6E0;
  --rad:14px; --shadow:0 1px 3px rgba(20,40,30,.08),0 8px 24px rgba(20,40,30,.06);
}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--paper);color:var(--ink);line-height:1.65;font-size:16px}
header{position:sticky;top:0;z-index:50;background:linear-gradient(90deg,var(--pine),var(--moss));color:#fff;display:flex;align-items:center;gap:16px;padding:12px 20px;box-shadow:0 2px 12px rgba(0,0,0,.15)}
#menuBtn{display:none;background:none;border:0;color:#fff;font-size:22px;cursor:pointer;line-height:1}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{font-size:22px}
.brand b{font-size:16px;letter-spacing:.2px}
.brand .crs{display:block;font-size:11.5px;opacity:.85;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hprog{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:180px}
.hbar{flex:1;height:8px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
#hbarFill{height:100%;width:0;background:var(--leaf);border-radius:99px;transition:width .4s ease}
#hpct{font-size:13px;font-weight:700;min-width:38px;text-align:right}
.layout{display:flex;max-width:1280px;margin:0 auto}
nav#sidebar{width:300px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);padding:18px 14px 90px;position:sticky;top:61px;overflow-y:auto;max-height:calc(100vh - 61px)}
.sb-sec{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--mut);text-transform:uppercase;margin:18px 8px 6px}
.sb-mod{font-size:12px;font-weight:700;color:var(--mut);margin:14px 8px 4px}
.sb-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;color:var(--ink);text-decoration:none;font-size:13.5px;font-weight:500;cursor:pointer;border-left:3px solid transparent}
.sb-item:hover{background:var(--mint2)}
.sb-item.active{background:var(--mint2);border-left-color:var(--leaf);font-weight:700}
.sb-item .st{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.sb-item.qz .st{border-radius:5px}
.sb-item.done .st{background:var(--leaf);border-color:var(--leaf)}
.sb-item.done .st::after{content:'✓'}
.sb-lock{font-size:12px;color:var(--mut);padding:6px 10px}
.sb-foot{margin-top:26px;padding-top:14px;border-top:1px solid var(--line)}
.sb-foot button{background:none;border:0;color:var(--mut);font-size:12px;cursor:pointer;text-decoration:underline;font-family:inherit}
main#main{flex:1;min-width:0;padding:28px 22px 90px}
.page{max-width:840px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow);padding:34px 38px 30px;animation:fadeup .28s ease}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.crumbs{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--moss);margin-bottom:8px}
h1.pagetitle{font-size:27px;line-height:1.25;letter-spacing:-.02em;margin-bottom:6px}
.metas{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 20px}
.chip{font-size:12px;font-weight:600;background:var(--mint2);color:var(--moss);padding:4px 11px;border-radius:99px;border:1px solid var(--mint)}
.video-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#0e1f18;border-radius:12px;overflow:hidden;margin:6px 0 24px}
.video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vph{display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#13291f,#13291f 14px,#16321f 14px,#16321f 28px)}
.vph-inner{display:flex;align-items:center;gap:16px;color:#cfe7d6;text-align:left}
.vph-icon{width:64px;height:64px;border-radius:50%;background:var(--leaf);display:flex;align-items:center;justify-content:center;color:#0e1f18;font-size:24px;box-shadow:0 0 0 8px rgba(82,183,136,.25)}
.vph-inner span{display:block;font-size:13px;opacity:.85;max-width:380px}
.lesson-body h3{font-size:19px;margin:26px 0 10px;letter-spacing:-.01em}
.lesson-body h4{font-size:15.5px;margin:18px 0 8px}
.lesson-body p{margin:0 0 14px}
.lesson-body ul,.lesson-body ol{margin:0 0 16px;padding-left:24px}
.lesson-body li{margin-bottom:7px}
.lesson-body blockquote{border-left:4px solid var(--leaf);background:var(--mint2);padding:14px 18px;border-radius:0 10px 10px 0;margin:0 0 16px;font-weight:600;color:var(--pine)}
.lesson-body table{width:100%;border-collapse:collapse;margin:6px 0 18px;font-size:14px}
.lesson-body th{background:var(--pine);color:#fff;text-align:left;padding:9px 12px;font-size:13px}
.lesson-body td{border:1px solid var(--line);padding:9px 12px;vertical-align:top}
.lesson-body tr:nth-child(even) td{background:#FAFCFA}
.lesson-body a{color:var(--moss);font-weight:600}
.callout{background:var(--mint2);border:1px solid var(--mint);border-radius:12px;padding:14px 18px;margin:18px 0;font-size:15px}
.callout.warn{background:var(--amberbg);border-color:#F2DCA0;color:#6b4a08}
.pause{background:var(--amberbg);border:1px dashed #E8C877;border-radius:12px;padding:14px 18px;margin:20px 0;font-size:15px}
.scen{background:#F7FAF7;border:1px solid var(--line);border-left:4px solid var(--moss);border-radius:10px;padding:12px 16px;margin:14px 0}
.scen h4{margin:0 0 4px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.two-col>div{background:#F7FAF7;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.arrows{display:grid;gap:12px;margin:16px 0}
.arrow-box{border:1px solid var(--line);border-radius:12px;padding:14px 18px;background:#F7FAF7;display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 16px}
.arrow-box .fw{font-weight:800;color:var(--pine);font-size:16px}
.arrow-box .dir{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;color:var(--moss);background:var(--mint2);padding:2px 10px;border-radius:8px;font-size:13.5px}
.arrow-box .q{width:100%;font-size:14.5px;color:#33463b}
.arrow-box.alt{background:#F2F7FF;border-color:#D8E4F5}
.step-list{counter-reset:step;list-style:none;padding-left:0!important}
.step-list li{counter-increment:step;position:relative;padding:10px 0 10px 52px;margin:0;border-bottom:1px dashed var(--line)}
.step-list li::before{content:counter(step);position:absolute;left:0;top:10px;width:34px;height:34px;border-radius:10px;background:var(--pine);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
.step-list strong.t{display:block;font-size:15.5px}
.takeaway{margin-top:26px;background:var(--pine);color:#E7F5EC;border-radius:12px;padding:16px 20px;font-size:15px}
.takeaway b{color:#fff}
details.reveal{border:1px solid var(--line);border-radius:12px;margin:10px 0 18px;background:#FBFDFB;overflow:hidden}
details.reveal summary{cursor:pointer;list-style:none;padding:12px 18px;font-weight:700;color:var(--moss);font-size:14.5px}
details.reveal summary::-webkit-details-marker{display:none}
details.reveal summary::before{content:'▸ ';color:var(--leaf)}
details.reveal[open] summary::before{content:'▾ '}
details.reveal .rv{padding:2px 18px 14px;font-size:14.5px}
details.reveal .rv p{margin:0 0 10px}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.05em;padding:2px 8px;border-radius:6px;margin-right:6px}
.tag.g{background:var(--mint);color:var(--pine)}
.tag.i{background:#E3EDFB;color:#274b7a}
.tag.b{background:#F1E8FA;color:#5b2d86}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:11px 20px;font-weight:700;font-size:14.5px;cursor:pointer;border:1px solid transparent;font-family:inherit;transition:all .15s}
.btn-primary{background:var(--moss);color:#fff}
.btn-primary:hover{background:var(--pine)}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--moss);color:var(--moss)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.page-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:28px;padding-top:20px;border-top:1px solid var(--line);flex-wrap:wrap}
.qcard{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;transition:border-color .2s}
.qcard.miss{border-color:var(--red);box-shadow:0 0 0 3px rgba(179,38,30,.08)}
.qnum{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.qtext{font-weight:600;margin-bottom:12px;font-size:15.5px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0;cursor:pointer;font-size:14.5px;transition:all .15s;background:#fff}
.opt:hover{border-color:var(--leaf)}
.opt input{margin-top:3px;accent-color:var(--moss)}
.opt .letter{font-weight:800;color:var(--moss);min-width:16px}
.opt.right{border-color:var(--leaf);background:var(--mint2)}
.opt.wrong{border-color:var(--red);background:var(--redbg)}
.match-row{display:flex;align-items:center;gap:12px;padding:8px 0;flex-wrap:wrap}
.match-row label{flex:1;min-width:220px;font-size:14.5px}
.match-row select{padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);font-family:inherit;font-size:14px;background:#fff;min-width:160px}
select.right{border-color:var(--leaf);background:var(--mint2)}
select.wrong{border-color:var(--red);background:var(--redbg)}
textarea.written{width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:10px;padding:12px;font-family:inherit;font-size:14.5px;resize:vertical}
textarea.written:focus{outline:none;border-color:var(--moss)}
.model{background:var(--mint2);border:1px solid var(--mint);border-radius:10px;padding:12px 16px;margin:10px 0;font-size:14.5px}
.selfbtns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.selfbtns button{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.selfbtns button.sel{border-color:var(--moss);background:var(--mint2);color:var(--pine)}
.qwhy{margin-top:10px;font-size:13.5px;background:#F5F8F5;border-radius:8px;padding:10px 14px;color:#3c4f44}
.qwhy b{color:var(--pine)}
#quizMsg{background:var(--redbg);color:var(--red);border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;margin:12px 0}
.results{margin-top:18px;border-radius:12px;padding:18px 22px;text-align:center}
.results.pass{background:var(--mint2);border:1px solid var(--mint)}
.results.fail{background:var(--redbg);border:1px solid #F0C9C5}
.scorebig{font-size:34px;font-weight:800;color:var(--pine)}
.results.fail .scorebig{color:var(--red)}
.results .rbtns{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.hero{background:linear-gradient(135deg,var(--pine),var(--moss));color:#fff;border-radius:var(--rad);padding:36px 36px 30px;margin-bottom:22px}
.hero h1{font-size:30px;letter-spacing:-.02em;line-height:1.2}
.hero p.sub{opacity:.92;margin:8px 0 18px;font-size:16px}
.herobadges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.hbadge{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:5px 12px;border-radius:99px;font-size:12.5px;font-weight:600}
.osec{margin:26px 0}
.osec h2{font-size:20px;margin-bottom:12px;letter-spacing:-.01em}
.ogrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ogrid .oc{display:flex;gap:10px;background:#F7FAF7;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px}
.ogrid .oc .n{color:var(--leaf);font-weight:800}
.mod-list{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mod-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:14.5px;background:#fff}
.mod-row:last-child{border-bottom:0}
.mod-row .mn{font-weight:700;color:var(--pine);min-width:110px;font-size:13px}
.mod-row .bar{flex:1;height:6px;background:var(--paper);border-radius:99px;overflow:hidden;min-width:60px}
.mod-row .bar i{display:block;height:100%;background:var(--leaf)}
.mod-row .cnt{font-size:12.5px;color:var(--mut);min-width:44px;text-align:right}
.res-card{display:flex;gap:16px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:#FBFDFB}
.res-ic{font-size:26px;background:var(--mint2);border-radius:12px;width:52px;height:52px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.res-card h4{margin:0 0 4px;font-size:16px}
.res-card p{font-size:14px;color:var(--mut);margin:0 0 12px}
.res-btns{display:flex;gap:10px;flex-wrap:wrap}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:8px}
.chk-row{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:14.5px}
.chk-row .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;flex-shrink:0}
.chk-row.ok .box{background:var(--leaf);border-color:var(--leaf)}
.chk-row.ok .box::after{content:'✓'}
.chk-row.bad .box{border-color:var(--red)}
.cert-card{border:6px double var(--pine);border-radius:8px;padding:44px 36px;text-align:center;background:#FFFDF6;margin:18px 0}
.cert-card .cbrand{font-weight:800;letter-spacing:.28em;font-size:13px;color:var(--moss);text-transform:uppercase}
.cert-card h2{font-family:Georgia,'Times New Roman',serif;font-size:34px;margin:14px 0 6px;color:var(--pine)}
.cert-card .cname{font-family:Georgia,serif;font-size:30px;font-weight:700;border-bottom:2px solid var(--pine);display:inline-block;padding:6px 34px;margin:16px 0 10px;min-width:280px}
.cert-card .cline{font-size:13px;color:var(--mut)}
.cert-card .cdate{margin-top:18px;font-size:13.5px}
input.name-input{font-size:16px;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;min-width:260px}
input.name-input:focus{outline:none;border-color:var(--moss)}
#backdrop{display:none;position:fixed;inset:0;background:rgba(10,25,18,.45);z-index:60}
@media print{
  header,nav#sidebar,#backdrop,.no-print,.page-actions,.crumbs{display:none!important}
  body{background:#fff}.page{border:0;box-shadow:none;max-width:100%;padding:0}.layout{display:block}
  .cert-card{margin:0;border-color:#333}
}
@media(max-width:920px){
  #menuBtn{display:block}
  .brand .crs{display:none}
  nav#sidebar{position:fixed;left:0;top:0;bottom:0;z-index:70;transform:translateX(-105%);transition:transform .25s ease;max-height:100vh;height:100vh}
  nav#sidebar.open{transform:none}
  #backdrop.show{display:block}
  main#main{padding:18px 12px 70px}
  .page{padding:24px 20px}
  .two-col,.ogrid{grid-template-columns:1fr}
  .hero{padding:26px 22px}
  .hprog{min-width:110px}
}

/* ===== v3 additions ===== */
.brand .logo{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#0f1f36;box-shadow:0 0 0 2px rgba(255,255,255,.4);flex-shrink:0}
#userChip{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
#userChip .uname{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#userChip button{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:5px 11px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
#userChip button:hover{background:rgba(255,255,255,.28)}
.unauth nav#sidebar,.unauth .hprog,.unauth #menuBtn,.unauth #userChip{display:none!important}
.unauth header{justify-content:flex-start}
.sb-user{font-size:12.5px;color:var(--mut);margin-bottom:8px;word-break:break-word}
.sb-foot button{font-weight:700}
.auth-wrap{display:flex;justify-content:center;padding:26px 0}
.auth-card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow);padding:32px 34px;text-align:center}
.auth-logo{width:96px;height:96px;border-radius:50%;box-shadow:0 6px 20px rgba(15,31,54,.3);margin-bottom:10px}
.auth-card h1{font-size:23px;letter-spacing:-.02em;margin:4px 0 6px}
.auth-card .mut{font-size:13.5px;color:var(--mut);margin-bottom:14px}
.auth-tabs{display:flex;gap:6px;background:var(--paper);border-radius:10px;padding:4px;margin:14px 0 16px}
.auth-tabs button{flex:1;border:0;background:none;padding:9px;border-radius:8px;font-family:inherit;font-weight:700;font-size:14px;color:var(--mut);cursor:pointer}
.auth-tabs button.on{background:#fff;color:var(--pine);box-shadow:0 1px 4px rgba(20,40,30,.12)}
.auth-card form{text-align:left}
.auth-card label{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin:12px 0 5px}
.auth-card input{width:100%;font-size:15px;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit}
.auth-card input:focus{outline:none;border-color:var(--moss)}
.auth-card .btn{width:100%;justify-content:center;margin-top:18px}
#authMsg{min-height:20px;margin-top:12px;font-size:13.5px;font-weight:600;color:var(--red)}
#authMsg.ok{color:var(--moss)}
.auth-links{margin-top:10px;font-size:13px;text-align:center}
.auth-links a{color:var(--moss);font-weight:700;cursor:pointer}
.demo-note{background:var(--amberbg);border:1px solid #F2DCA0;color:#6b4a08;border-radius:10px;padding:10px 12px;font-size:12.5px;margin:0 0 12px;text-align:left}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--pine);color:#fff;padding:11px 20px;border-radius:99px;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:all .3s;z-index:200}
#toast.show{opacity:1;transform:translate(-50%,0)}
.trackhint{background:var(--amberbg);border:1px solid #F2DCA0;color:#6b4a08;border-radius:10px;padding:9px 14px;font-size:13.5px;margin:0 0 16px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.trackhint.ok{background:var(--mint2);border-color:var(--mint);color:var(--pine);font-weight:600}
.trackhint .th{font-weight:600}
.trackhint .th.y{color:var(--moss)}
.video-note{background:var(--amberbg);border:1px solid #F2DCA0;color:#6b4a08;border-radius:10px;padding:10px 14px;font-size:13.5px;margin:-12px 0 18px}
.ansbar{position:sticky;top:61px;z-index:20;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin:12px 0;display:flex;align-items:center;gap:12px;font-size:13.5px;font-weight:700;color:var(--pine);box-shadow:0 2px 8px rgba(20,40,30,.06)}
.ansbar .bar{flex:1;height:6px;background:var(--paper);border-radius:99px;overflow:hidden}
.ansbar .bar i{display:block;height:100%;width:0;background:var(--leaf);transition:width .2s}
.modbreak{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;text-align:left;font-size:13.5px;margin:14px auto 0;max-width:460px}

  /* ---------------- MODULE 0 — bonus, no video ---------------- */
  { id:0, name:"Module 0 — Introduction", items:[
    { type:"lesson", id:"0.1", title:"Welcome to the Course", minutes:4,
      takeaway:"GRI looks at the company's impact on the world. IFRS S1/S2 looks at the world's impact on the company. Everything else in this course is detail.",
      html:`
<p>Welcome! This course is built around a ten-part video series that walks through sustainability reporting from first principles. Each lesson pairs one video with a full written version of the same material and a downloadable resource you can reuse in your own work. Every module ends with a short multiple-choice assignment, and the course closes with a 40-question Final Assessment.</p>
<p>Here's the problem this course solves. You've probably heard the words <em>GRI, IFRS S1, IFRS S2, materiality, sustainability disclosures</em> — and everyone uses them as if they're interchangeable. They're not. And the confusion isn't your fault: the frameworks genuinely answer different questions, and almost nobody explains that clearly.</p>
<h3>By the end of this course, you'll be able to:</h3>
<ol>
<li>Explain what sustainability reporting is — and why companies do it</li>
<li>Explain the basic purpose of GRI</li>
<li>Explain the basic purpose of IFRS S1 and IFRS S2</li>
<li>Explain the difference between impact materiality and financial materiality</li>
<li>Describe how a GRI report is structured and built</li>
<li>Describe the disclosure structure of IFRS S1/S2</li>
<li>Apply both frameworks to a real business case</li>
</ol>
<div class="callout"><strong>What you should already know:</strong> nothing. If you understand what a company is — factories, employees, customers, suppliers — you're ready.</div>
<div class="callout warn"><strong>What you won't learn (on purpose):</strong> Scope 1/2/3 calculations, climate scenario analysis, ESRS/CSRD, assurance, or paragraph-by-paragraph standards coverage. That's deliberate — trying to learn everything at once is how people get overwhelmed and quit. Those are future courses. This one gives you the foundation the advanced stuff sits on.</div>
<h3>How to use this course</h3>
<ul>
<li>Watch the video for each lesson — or read the full written notes below it. Both cover the same ground.</li>
<li>Download the resource attached to each lesson. You'll use several of them again in the final assignment.</li>
<li>Your progress is tracked automatically: a lesson counts as complete once you have watched its video to the end and read to the bottom of the page. There is nothing to click.</li>
<li>Take each module assignment. You can retake any assignment, any time — your best score is saved.</li>
<li>Pass the Final Assessment with at least 70% to unlock your certificate.</li>
</ul>
<p>One promise before we start. If you remember only one sentence from this entire course, make it this one:</p>
<blockquote>GRI looks at the company's impact on the world. IFRS S1/S2 looks at the world's impact on the company.</blockquote>
<p>Everything else is detail. Let's begin.</p>`}
  ]},

  /* ---------------- MODULE 1 — Foundations (Videos 1–2) ---------------- */
  { id:1, name:"Module 1 — Foundations", items:[
    { type:"lesson", id:"1.1", title:"The Difference Between GRI and IFRS S1/S2", minutes:8,
      takeaway:"GRI looks at the company's impact on the world. IFRS S1/S2 looks at how the world's sustainability and climate issues can affect the company. They're not competing frameworks — they're different questions, and they're often used together.",
      html:`
<p>If you're new to ESG reporting, there is one question you will run into almost immediately: should a company report using GRI, or using IFRS S1 and IFRS S2? That question is where a lot of confusion starts, because GRI and IFRS S1/S2 are not two competing versions of the same reporting framework. They are designed to answer different questions. Once that distinction is clear, sustainability reporting becomes considerably easier to follow — and that distinction is what this lesson is about.</p>
<h3>The same event, asked about twice</h3>
<div class="scen"><h4>🏭 A factory discharges polluted wastewater into a nearby river.</h4></div>
<p>Start with GRI. GRI is interested in the company's impact on the world around it, so the questions it asks are: how much pollution entered the river? Was the ecosystem damaged? Were fish or other species affected? Did nearby communities lose access to clean water? What is the company doing to prevent or reduce the impact? The important point is that this impact matters under GRI even if it never shows up as a financial loss for the company.</p>
<p>Now look at the identical event through IFRS S1. The question changes entirely. Instead of asking what impact the company had on the river, IFRS S1 asks whether this sustainability-related issue could reasonably affect the company's prospects. Could the pollution result in regulatory penalties, lawsuits, higher compliance costs, lost customers, reputational damage, difficulty obtaining financing, or reduced future cash flows? The focus has shifted to information that could reasonably be expected to affect an investor's decisions about the company. Same event — a genuinely different question.</p>
<h3>Where IFRS S2 fits in</h3>
<p>IFRS S1 is the broader standard: it deals with sustainability-related risks and opportunities of every kind that could affect a company's prospects. IFRS S2 sits inside that broader standard and focuses specifically on climate. If climate change could affect a company's cash flows, its access to finance, or its cost of capital, IFRS S2 is what helps the company report that to investors. Think of IFRS S2 as the climate-specific chapter within the wider IFRS Sustainability framework — a distinction we'll come back to properly in Module 5.</p>
<h3>Before choosing a reporting approach, ask four questions</h3>
<p>So when you're looking at a company's sustainability reporting, resist the urge to ask "GRI or IFRS?" as the first question. Ask these instead: who is the report primarily designed to inform? Are we measuring the company's impacts, or sustainability-related risks and opportunities to the company? What does materiality mean under the framework being used? And does the company need information for broad impact reporting, investor-focused reporting, or potentially both?</p>
<p>That last question matters more than it looks. Using GRI and using IFRS S1/S2 are not mutually exclusive. A company may have good reasons to report its impacts on the world while also providing investor-focused sustainability disclosures. The frameworks are frequently complementary rather than alternatives.</p>
<div class="callout">💡 <strong>The one-sentence rule:</strong> GRI looks primarily at the company's impacts on the economy, environment and people. IFRS S1 and S2 look at sustainability- and climate-related risks and opportunities that could affect the company's prospects. Or even shorter — GRI: what impact are we having on the world? IFRS S1/S2: how can sustainability and climate affect the company?</div>
<p>That distinction is the foundation for everything else in this course. Next, we step back even further and ask a more basic question: what is a sustainability report actually for?</p>`},
    { type:"lesson", id:"1.2", title:"What a Sustainability Report Is Actually For", minutes:9,
      takeaway:"A sustainability report isn't a collection of ESG numbers — it's a structured explanation of what's happening, why it matters, what the company is doing, and what it could mean for the future. The framework just supplies the rules for answering those questions.",
      html:`
<p>Before comparing GRI, IFRS S1 or IFRS S2 any further, it's worth stepping back and asking a more basic question: what is a sustainability report actually trying to do? The answer is simpler than the terminology suggests. A sustainability report is a structured way of telling the story of what is happening around a company, what matters, what the company is doing about it, and what that could mean going forward.</p>
<h3>Companies already generate this information</h3>
<p>Take an ordinary manufacturing company. It has employees. It uses electricity and fuel. It consumes water. It generates waste. It buys materials from suppliers, transports products, and sells to customers. In the course of all of that, it can also create — or face — a wide range of other issues: workers getting injured, suppliers with poor labour practices, pollution of a nearby water source, extreme heat making production harder, new regulations that could raise costs, or customers demanding more sustainable products.</p>
<p>All of this information already exists simply because the company operates. The problem is that it's usually scattered — HR holds some of it, operations holds some, procurement holds some, finance holds some, and the sustainability team holds the rest. A sustainability report brings the relevant pieces together into one coherent account.</p>
<h3>Turning a number into a story</h3>
<p>Suppose the company uses a large amount of water. A sustainability report doesn't just need to say "we used 500,000 cubic metres of water" — that's just a number, and a number without context tells the reader very little. Instead, four questions turn it into something useful:</p>
<ol>
<li><strong>What's happening?</strong> How much water is being used, where, and is consumption rising or falling?</li>
<li><strong>What effect is it having?</strong> Is the company operating in a water-stressed area? Could its use affect local communities or ecosystems?</li>
<li><strong>What is the company doing about it?</strong> Is it recycling water, changing its process, or setting reduction targets?</li>
<li><strong>What could this mean for the future?</strong> Could scarcity disrupt production? Could regulation raise costs? Could stakeholders become concerned?</li>
</ol>
<p>Answered together, these four questions turn a random figure into a picture of the company's actual sustainability-related situation.</p>
<h3>Where the frameworks come in</h3>
<p>A company facing all of these issues can't report everything, so a framework gives it a structured way to decide what to identify, what's important enough to report, what to disclose, and how to present it. This is exactly where GRI, IFRS S1 and IFRS S2 begin to diverge — they don't look at the company in the same way. They have different purposes, different audiences, and different approaches to deciding what's material. But underneath the technical language, every framework is still describing the same real-world company.</p>
<div class="callout">🧭 <strong>Before reporting anything, ask:</strong> what's happening? Who or what is affected? What is the company doing about it? Could this create meaningful consequences later? And then a fifth question that matters more than it sounds: who needs this information, and why? That last one is the question that separates GRI from IFRS S1/S2 — the same issue can matter for entirely different reasons depending on who's asking.</div>
<p>So don't think of a sustainability report as a pile of ESG numbers. Think of it as a structured explanation — what's happening, why it matters, what's being done, and what could happen next — with the reporting framework supplying the rules for which questions matter and how to answer them. With that foundation in place, we can tackle the word sitting underneath almost everything in this field: materiality.</p>`}
  ]},

  /* ---------------- MODULE 2 — Materiality (Videos 3–4) ---------------- */
  { id:2, name:"Module 2 — Materiality", items:[
    { type:"lesson", id:"2.1", title:"Materiality — The Word That Confuses Everyone", minutes:9,
      takeaway:"GRI's materiality test asks how significant the company's impact is on people, environment or economy. IFRS S1's materiality test asks whether an issue could reasonably affect the company's own financial prospects. Same word, two different questions.",
      html:`
<p>If there's one word that trips up more people in ESG than any other, it's materiality. It sounds the same everywhere it's used, but GRI and IFRS attach genuinely different meanings to it — and mixing them up is one of the most common mistakes people make when they're new to this field.</p>
<h3>GRI: materiality as impact</h3>
<p>Under GRI, materiality is about impact. The question is: how significant is the company's effect on people, the environment, or the economy? Picture a factory with two thousand workers that discovers some of its suppliers are paying employees below the legally required wage. That issue might have no meaningful effect on the company's financial performance today — investors might never notice. But it's a serious impact on real people, and under GRI, that alone can be enough to make it material.</p>
<h3>IFRS S1: materiality as financial relevance</h3>
<p>Under IFRS S1, materiality means something different. The question becomes: could this reasonably affect the decisions of investors, lenders, or creditors? In plain terms — could it eventually touch the company's cash flow, its access to financing, or its cost of capital? If the answer is no, the issue may still matter to the world, but it won't clear the bar for IFRS S1.</p>
<div class="callout">⚖️ Neither test is wrong — they're answering different questions. Impact materiality serves the Company → World direction; financial materiality serves the World → Company direction. We'll build that mental picture properly in the next lesson.</div>
<h3>A worked example: water in a water-stressed region</h3>
<div class="scen"><h4>💧 A factory uses a large amount of water every day, in a region where the local community already struggles with water scarcity.</h4></div>
<p>Run the GRI test first: is that water use damaging the environment or hurting the people nearby? If it is, it's very likely material under GRI. Now run the IFRS S1 test: could water scarcity disrupt production or raise costs for the company? If the company has cheap, secure water access and faces no regulatory pressure, the answer might be no — even though the real-world environmental impact is very real. Same facts, examined through two different tests, with two different outcomes.</p>
<div class="callout">💡 That's not a flaw in the system — it's the entire reason both lenses exist. An issue can be significant to the world and financially irrelevant to the company at the same time, and a good ESG professional needs to be comfortable holding both conclusions about the same fact pattern.</div>
<p>Once this clicks, a lot of what follows in sustainability reporting gets easier to read: who a report is written for, how each framework structures its disclosures, and why the same topic can appear so differently depending on which standard you're looking at. Next, we'll turn this into a simple picture you can carry with you every time you're deciding what's material.</p>`},
    { type:"lesson", id:"2.2", title:"Two Lenses on One Company", minutes:8,
      takeaway:"Every issue gets looked at through two independent lenses — GRI asks what impact the company has on the world, IFRS S1/S2 asks what effect the world's sustainability issues could have on the company. They sometimes agree, and sometimes don't — both outcomes are normal.",
      html:`
<p>By now the pattern from the last lesson should feel familiar, so let's turn it into a picture you can hold in your head permanently.</p>
<p>Imagine standing in front of a company and being handed two different lenses to look through. The first lens is GRI. Looking through it, you ask what significant impact this company has on the people around it, on the environment, on the local economy, and on human rights. Whatever comes into sharp focus becomes a GRI material topic.</p>
<p>The second lens is IFRS S1 and S2. Looking through it, you ask something different: what sustainability-related risks or opportunities could affect this company's cash flows, its access to finance, its cost of capital, or its business strategy? Whatever comes into focus through this lens becomes material under the ISSB standards.</p>
<h3>The two lenses don't always show the same picture</h3>
<p>Sometimes an issue is sharp through both lenses at once — climate change is the classic example, and we'll come back to exactly why in Module 5. Sometimes an issue is obvious through one lens and nearly invisible through the other, the way water scarcity worked in the previous lesson: clearly material to GRI, and only conditionally material to IFRS S1 depending on how exposed the company actually is.</p>
<div class="two-col">
<div><h4>GRI lens</h4><p>What significant impact does this company have on people, the environment, the economy and human rights?</p></div>
<div><h4>IFRS S1/S2 lens</h4><p>What sustainability-related risks or opportunities could affect this company's cash flows, financing, cost of capital or strategy?</p></div>
</div>
<p>Once you start thinking of materiality as two separate lenses rather than one blurry idea, the rest of ESG reporting becomes much easier to follow — including the practice exercises in your downloadable worksheet for this lesson, where you'll run both lenses against a set of real scenarios yourself. Next, we open up GRI itself and look at how it's actually structured.</p>`}
  ]},

  /* ---------------- MODULE 3 — Understanding GRI (Videos 5–6) ---------------- */
  { id:3, name:"Module 3 — Understanding GRI", items:[
    { type:"lesson", id:"3.1", title:"What GRI Actually Is, in Plain Terms", minutes:10,
      takeaway:"GRI is built from three stacked layers: Universal Standards apply to everyone, Sector Standards narrow by industry, and Topic Standards cover the specific issues that turn out to be material for a given company.",
      html:`
<p>GRI stands for the Global Reporting Initiative, and although its standards can look intimidating at first glance, they're organized in a way that's more logical than it appears. There are three layers, stacked on top of each other.</p>
<h3>The three layers</h3>
<ul>
<li><strong>Layer 1 — Universal Standards.</strong> These apply to every company, regardless of industry. They cover the foundational rules of reporting, general disclosures about the organization, and how material topics are determined. This is the base layer that every company builds on.</li>
<li><strong>Layer 2 — Sector Standards.</strong> Written for specific industries — oil and gas, agriculture, textiles, mining — because a mining company and a software company generate very different kinds of impact and shouldn't be assessed against the same starting assumptions.</li>
<li><strong>Layer 3 — Topic Standards.</strong> Individual subjects: energy, emissions, water and effluents, biodiversity, occupational health and safety, human rights, anti-corruption. A company only reports against the topic standards that turned out to be material for it — not all of them.</li>
</ul>
<h3>Made concrete: a textile manufacturer</h3>
<ul>
<li><strong>Universal</strong> → the general reporting foundation: who the company is, how it determines materiality.</li>
<li><strong>Sector</strong> → textile and apparel sector considerations: the topics likely to matter for this industry.</li>
<li><strong>Topic</strong> → the specific material topics that emerge, such as Energy, Water and Effluents, Occupational Health and Safety, Emissions, and Human Rights in the supply chain.</li>
</ul>
<p>GRI describes these three layers as an interconnected system rather than three separate rulebooks, and that's the right way to think about them. Start broad with the Universal Standards. Narrow by industry with the Sector Standards. Get specific with the Topic Standards that are actually material to the business.</p>
<div class="callout">👥 Because GRI is impact-focused, its reports serve a broad audience — communities, employees, NGOs, governments, customers, and investors. That's worth holding onto, because it contrasts sharply with who IFRS S1 is written for, which we'll get to in Module 4.</div>
<p>Understanding what GRI is in theory is one thing. Next, we'll walk through exactly how a company actually goes from "we need to report" to a finished report, step by step.</p>`},
    { type:"lesson", id:"3.2", title:"How a Company Actually Builds a GRI Report", minutes:12,
      takeaway:"A GRI report is built through seven steps: understand the organization, map the value chain, identify impacts, filter by severity and likelihood, convert survivors into formal topics, gather the data, and report policies and performance — not just numbers.",
      html:`
<p>Understanding GRI in theory is one thing. Watching how a company actually gets from "we need to report" to a finished report is another — and it happens in a logical, repeatable sequence of seven steps. This is one of the more practically useful lessons in the course, so it's worth returning to.</p>
<ol class="step-list">
<li><strong class="t">Understand the organization.</strong> Products, factories, employees, suppliers, customers, energy and water use, waste, emissions, and community relationships. You cannot decide what's material until you actually understand the business.</li>
<li><strong class="t">Look beyond the factory walls.</strong> Impacts don't stop at the company's own operations — they run through the full value chain, from raw-material suppliers to the end of the product's life. A garment brand's biggest human-rights impacts might sit in cotton farms it doesn't even own.</li>
<li><strong class="t">Identify impacts across that chain.</strong> Environmental impacts like emissions, water and waste; social impacts like health and safety, wages and human rights; economic impacts like employment and local taxes. Cast a wide net — a company might identify thirty, forty, even fifty potential impacts at this stage.</li>
<li><strong class="t">Narrow the list down.</strong> Not all fifty matter equally. GRI asks you to judge each impact by its severity — scale (how bad?), scope (how widespread?), and irremediability (how hard to fix?) — plus the likelihood of it occurring. This filtering step is the analytical heart of a GRI report.</li>
<li><strong class="t">Turn what survives into formal topics.</strong> "Employees getting injured" becomes Occupational Health and Safety. "Excessive water use" becomes Water and Effluents. This gives you your list of material topics.</li>
<li><strong class="t">Match each topic to its GRI Topic Standard and gather the data.</strong> Each material topic has a standard with specific disclosures and metrics attached — this becomes the data-collection effort, with an owner for each figure.</li>
<li><strong class="t">Go beyond the number.</strong> This step is easy to skip, and skipping it is the mark of a weak report. For each material topic, GRI wants the company's policies, its commitments, the actions it's taking, and its actual performance against targets — not just a figure.</li>
</ol>
<div class="callout">🧭 Notice what this process actually is: the Company → World arrow, operationalized. Understand the company, look outward at its impacts, judge their significance, and report on what matters. In the next module, we switch arrows entirely.</div>`}
  ]},

  /* ---------------- MODULE 4 — Understanding IFRS S1 (Video 7) ---------------- */
  { id:4, name:"Module 4 — Understanding IFRS S1", items:[
    { type:"lesson", id:"4.1", title:"What IFRS S1 Actually Is, in Plain Terms", minutes:9,
      takeaway:"IFRS S1 is the general, umbrella sustainability standard, written for investors, lenders and creditors. Its one consistent test: could this issue reasonably affect the company's own prospects?",
      html:`
<p>Time to switch lenses — the arrow reverses, from Company → World to World → Company. IFRS S1's full name is <em>General Requirements for Disclosure of Sustainability-related Financial Information</em>, and that clunky title is actually a fairly accurate description: it's the general, umbrella standard within the ISSB framework.</p>
<h3>What it covers</h3>
<p>Sustainability-related risks and opportunities broadly — not just climate. Water availability. Human capital and labour issues. Supply-chain risk. Technology shifts. Reputational exposure. Regulatory change. If it's a sustainability issue that could plausibly touch the business, it can fall under IFRS S1.</p>
<h3>Who it's written for</h3>
<p>This is the sharpest contrast with GRI: investors, lenders, and other creditors. Not communities, not employees, not the general public. GRI's audience is broad; IFRS S1's audience is capital markets, and that single fact shapes everything about how the standard is designed.</p>
<h3>The one consistent test</h3>
<p>Underneath all of that variety, there's one test running through the entire standard: could this issue reasonably be expected to affect the company's prospects? If a sustainability issue can plausibly move the needle on cash flows, financing, or future performance, it falls within scope. If it can't, it generally doesn't.</p>
<div class="two-col">
<div><h4>GRI asks about impact</h4><p>What effect does the company have on the world?</p></div>
<div><h4>IFRS S1 asks about financial relevance</h4><p>How could the world's sustainability issues affect the company?</p></div>
</div>
<div class="callout">📅 <strong>Practical note:</strong> IFRS S1 became effective for annual reporting periods beginning on or after 1 January 2024, with early application allowed as long as IFRS S2 is applied alongside it. That condition is a natural bridge into what IFRS S2 covers, which is exactly where we're headed next.</div>`}
  ]},

  /* ---------------- MODULE 5 — Understanding IFRS S2 (Videos 8–9) ---------------- */
  { id:5, name:"Module 5 — Understanding IFRS S2", items:[
    { type:"lesson", id:"5.1", title:"IFRS S2 Is IFRS S1's Climate Chapter", minutes:9,
      takeaway:"IFRS S2 is IFRS S1's climate-specific chapter, applied alongside it. Climate risk splits into physical risk (the climate itself) and transition risk (the shift away from carbon).",
      html:`
<p>If IFRS S1 is the broad umbrella, IFRS S2 is much narrower — and, honestly, easier to remember. IFRS S1 covers sustainability-related risks and opportunities of every kind. IFRS S2 covers exactly one of them: climate. The two are meant to be applied together — S1 sets the general structure, and S2 fills in the climate-specific detail within it.</p>
<h3>Two families of climate risk</h3>
<div class="two-col">
<div><h4>🌀 Physical risk</h4><p>The direct, physical effects of climate change: flooding, extreme heat, drought, storms, rising sea levels. The risks of a changing physical world.</p></div>
<div><h4>⚙️ Transition risk</h4><p>Risk from the shift toward a lower-carbon economy: carbon pricing, tightening regulation, changing customer preferences, and new technology making older assets less competitive. The risks of the transition itself.</p></div>
</div>
<p>A company reporting under IFRS S2 is expected to think through both categories and explain how each could plausibly affect its business going forward — and "plausibly" is doing real work in that sentence. It isn't enough to note that a risk exists; the standard wants a company to trace the mechanism by which that risk could show up in its financial results.</p>
<div class="callout">🌱 Notice the symmetry with GRI one more time: under GRI, a company's emissions are an impact on the world. Under IFRS S2, those same emissions are a source of financial risk. Same molecule of CO2, two completely different questions being asked about it.</div>
<p>In the next lesson, we'll look at the four questions that sit underneath every single IFRS S1 and S2 disclosure, no matter which specific issue is being discussed — including climate.</p>`},
    { type:"lesson", id:"5.2", title:"The Four Questions Every IFRS S1/S2 Disclosure Answers", minutes:11,
      takeaway:"Every IFRS S1/S2 disclosure answers the same four questions — Governance, Strategy, Risk Management, and Metrics & Targets — no matter which sustainability issue is being discussed.",
      html:`
<p>One of the more genuinely useful things about IFRS S1 and S2 is that, underneath all the detail, every single disclosure is built around the same four questions. Learn these four and you can pick up almost any ISSB-aligned report and immediately know what you're looking at.</p>
<ol class="step-list">
<li><strong class="t">Governance — who's responsible?</strong> Who actually oversees this sustainability-related risk or opportunity? Usually this means naming the board committee that watches it, plus the management roles handling it day to day. The underlying question: is anyone actually accountable, or is this a PDF nobody owns?</li>
<li><strong class="t">Strategy — how does it affect the business?</strong> How does this issue affect the business model and strategy? A textile manufacturer facing water scarcity, for instance, might invest in water-efficient machinery or switch suppliers — that chain of reasoning, issue leading to business consequence leading to strategic response, is exactly what belongs in this section.</li>
<li><strong class="t">Risk management — how is it identified and handled?</strong> How does the company identify, assess, and respond? Usually described as a process: identify, assess by likelihood and impact, respond, and monitor. And critically: is this process integrated with the company's overall enterprise risk management, or bolted on separately?</li>
<li><strong class="t">Metrics and targets — how is it measured?</strong> This is where the numbers live — tonnes of CO2e, energy consumption, water usage, employee turnover, progress against stated targets. This is often where GRI-style data reappears, but framed inside a financial story rather than an impact story.</li>
</ol>
<div class="callout">🧠 <strong>Memory device:</strong> G → S → R → M — Governance, Strategy, Risk Management, Metrics &amp; Targets.</div>
<p>Two things worth noticing before we move on. First, GRI's seven steps from Module 3 are about finding what to report — a funnel. IFRS S1/S2's four-part structure is about how to describe each issue once you've decided it matters — a frame. Different jobs entirely. Second, Metrics &amp; Targets is where the two frameworks physically overlap in a final report — a water-usage number can appear in both — but under GRI it sits as an impact disclosure, while under IFRS S1 it sits inside a risk story: who governs it, how it affects strategy, how it's managed, how it's measured.</p>
<p>With both frameworks now covered individually, the final lesson brings them together in a single worked example, applied to one company at once.</p>`}
  ]},

  /* ---------------- MODULE 6 — Bringing It Together (Video 10) ---------------- */
  { id:6, name:"Module 6 — Bringing It Together", items:[
    { type:"lesson", id:"6.1", title:"One Company, Both Frameworks — A Worked Example", minutes:14,
      takeaway:"One company, two lenses: GRI asks what impact the company has on the world, IFRS S1/S2 asks how the world's sustainability and climate risks loop back onto the company. The strongest reporting programs run both, because together they tell a fuller story than either alone.",
      html:`
<p>Everything covered in this course comes together most clearly with a single worked example. Picture a company called PakManufacture Ltd., a manufacturer of surgical instruments for export, with a thousand employees, heavy metal-processing operations, high electricity, gas and water consumption, and a complex international supply chain.</p>
<h3>The GRI view</h3>
<p>The question here is: what impact does PakManufacture have? Looking across its operations, the significant impacts include workplace injuries and long hours, human-rights risks in the supplier base, energy consumption and emissions, water use and wastewater, hazardous waste, and product safety. After assessing significance, five material topics emerge: occupational health and safety, energy and emissions, water and effluents, waste, and human rights in the supply chain.</p>
<h3>The IFRS S1/S2 view</h3>
<p>Now switch lenses. The question becomes: which of these issues could actually affect the company's financial prospects? Could extreme heat reduce factory productivity? Could flooding disrupt transport? Could export customers demand lower-carbon products? Extreme heat, for example, could reduce productivity, which lowers production, which lowers revenue. High emissions could cause customers to demand lower-carbon suppliers, risking lost contracts and lower revenue. Build the chain each time: climate issue → operational consequence → financial consequence.</p>
<h3>The same topic, pulling in different directions</h3>
<p>Look closely at worker safety and you can see the two frameworks pulling apart. GRI asks what impact operations have on worker health and safety, full stop. IFRS S1 asks whether workforce safety issues could affect the company's prospects — through compensation costs, lawsuits, or production disruption. Both frameworks care about the same topic; they're simply measuring different things about it.</p>
<h3>Where the two lenses land</h3>
<p>Climate change is material under both frameworks at once — GRI cares because company emissions affect the environment, and IFRS S2 cares because transition risk could affect revenue and cost. A factory's impact on a local ecosystem might be significant under GRI while creating no financial consequence, so it may not clear the bar under IFRS S1. And the reverse happens too: an asset becoming obsolete because of the shift to low-carbon technology could create a real impairment risk under IFRS S1/S2 without necessarily standing out under GRI's impact lens at all.</p>
<div class="callout">🧭 <strong>The complete picture:</strong> GRI is fundamentally about the company's impact on the world. IFRS S1 and S2 are fundamentally about how the world's sustainability and climate risks loop back and affect the company. They're not rivals — the strongest reporting programs run both assessments side by side, because together they tell a fuller story than either one does alone.</div>
<p>That's the whole course, applied to one real case. Before you move on, your downloadable Case Study Analysis Template lets you run this exact exercise on a company of your own choosing — which is also the foundation of the final assignment.</p>`}
  ]},

/* ---------- toast ---------- */
function toast(msg){
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 3200);
}

/* ============================================================================
   ACCOUNTS & SAVED PROGRESS
   • If FIREBASE_CONFIG (top of this file) is filled in → real cloud accounts
     (Firebase Authentication + Cloud Firestore). Progress follows the student
     to any device.
   • If it is empty → "demo mode": accounts and progress are stored in the
     browser only, so you can test the whole course before Firebase is set up.
   ============================================================================ */
const FB_CONFIGURED = !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId);
const FB_OK = FB_CONFIGURED && !!window.firebase;
const DEMO_MODE = !FB_OK;

const Backend = (function(){
  if(FB_OK){
    firebase.initializeApp(FIREBASE_CONFIG);
    const auth = firebase.auth(), db = firebase.firestore();
    const ref = uid => db.collection('users').doc(uid);
    let pendingName = null;
    return {
      init(cb){
        auth.onAuthStateChanged(async u => {
          if(!u){ cb(null); return; }
          let name = pendingName || u.displayName || '';
          try{ const s = await ref(u.uid).get(); if(s.exists && s.data().name) name = s.data().name; }catch(e){}
          cb({ uid:u.uid, email:u.email, name: name || (u.email||'').split('@')[0] });
        });
      },
      async signUp(name, email, pw){
        pendingName = name;
        const c = await auth.createUserWithEmailAndPassword(email, pw);
        try{ await c.user.updateProfile({ displayName:name }); }catch(e){}
        try{ await ref(c.user.uid).set({ name, email }, { merge:true }); }catch(e){}
      },
      signIn(email, pw){ return auth.signInWithEmailAndPassword(email, pw); },
      signOut(){ return auth.signOut(); },
      reset(email){ return auth.sendPasswordResetEmail(email); },
      async load(uid){ const s = await ref(uid).get(); return s.exists ? s.data() : {}; },
      save(uid, d){ return ref(uid).set(d, { merge:true }); }
    };
  }
  /* ----- demo mode (browser only) ----- */
  const U = 'gm_demo_users', S = 'gm_demo_session', P = 'gm_demo_progress_';
  const rd = (k, f) => { try{ return JSON.parse(localStorage.getItem(k)) || f; }catch(e){ return f; } };
  const hash = s => { let h1=0xdeadbeef, h2=0x41c6ce57; for(let i=0;i<s.length;i++){ const c=s.charCodeAt(i); h1=Math.imul(h1^c,2654435761); h2=Math.imul(h2^c,1597334677); }
    h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
    return (4294967296*(2097151&h2)+(h1>>>0)).toString(36); };
  const pub = u => ({ uid:u.uid, email:u.email, name:u.name });
  let listener = () => {};
  return {
    init(cb){ listener = cb; const em = localStorage.getItem(S); const u = em && rd(U,{})[em]; cb(u ? pub(u) : null); },
    async signUp(name, email, pw){
      const users = rd(U,{}), k = email.toLowerCase();
      if(users[k]) throw { code:'auth/email-already-in-use' };
      if(pw.length < 6) throw { code:'auth/weak-password' };
      users[k] = { uid:'local-'+hash(k), name, email:k, h:hash(k+pw) };
      localStorage.setItem(U, JSON.stringify(users)); localStorage.setItem(S, k); listener(pub(users[k]));
    },
    async signIn(email, pw){
      const users = rd(U,{}), k = email.toLowerCase(), u = users[k];
      if(!u || u.h !== hash(k+pw)) throw { code:'auth/invalid-credential' };
      localStorage.setItem(S, k); listener(pub(u));
    },
    async signOut(){ localStorage.removeItem(S); listener(null); },
    async reset(){ throw { code:'demo/no-reset' }; },
    async load(uid){ return rd(P+uid, {}); },
    async save(uid, d){ localStorage.setItem(P+uid, JSON.stringify(d)); }
  };
})();

function authMsg(e){
  const c = (e && e.code) || '';
  const m = {
    'auth/email-already-in-use':'An account with this email already exists. Try signing in.',
    'auth/invalid-email':'Please enter a valid email address.',
    'auth/weak-password':'Password must be at least 6 characters.',
    'auth/invalid-credential':'Email or password is incorrect.',
    'auth/wrong-password':'Email or password is incorrect.',
    'auth/user-not-found':'Email or password is incorrect.',
    'auth/too-many-requests':'Too many attempts. Please wait a moment and try again.',
    'auth/network-request-failed':'Network problem. Check your connection and try again.',
    'auth/unauthorized-domain':'This website address is not authorised in your Firebase project (Authentication → Settings → Authorized domains).',
    'auth/operation-not-allowed':'Email/password sign-in is not switched on in your Firebase project.',
    'demo/no-reset':'Password reset needs cloud accounts, which are not switched on in demo mode.'
  };
  return m[c] || ('Something went wrong (' + (c || (e && e.message) || 'unknown') + ').');
}

/* ---------- state ---------- */
let currentUser = null, data = {}, authReady = false, authMode = 'signin', persistBlocked = false;
function persist(){
  if(!currentUser || persistBlocked) return;
  const snap = JSON.parse(JSON.stringify(data));
  Promise.resolve().then(() => Backend.save(currentUser.uid, snap)).catch(() => toast('Could not save your progress. Check your connection.'));
}
function onUser(u){
  if(!u){ currentUser = null; data = {}; persistBlocked = false; authReady = true; authMode = 'signin'; route(); return; }
  currentUser = u;
  Promise.resolve().then(() => Backend.load(u.uid))
    .then(d => { data = d || {}; persistBlocked = false; if(!data.name) data.name = u.name; })
    .catch(() => { data = { name:u.name }; persistBlocked = true; toast('Could not load your saved progress. Please reload the page.'); })
    .then(() => { authReady = true; route(); });
}
function doSignOut(){ Promise.resolve(Backend.signOut()).then(() => { location.hash = '#/'; }); }

/* ---------- course helpers ---------- */
Object.keys(QUIZZES).forEach(qid => {
  const q = QUIZZES[qid];
  const mod = COURSE.modules.find(m => m.id === q.afterModule);
  if(mod && !mod.items.some(i => i.type==='quiz' && i.id===qid)) mod.items.push({ type:'quiz', id:qid, title:q.title, minutes:5 });
});
const FLAT = [];
COURSE.modules.forEach(m => m.items.forEach(it => FLAT.push({ ...it, module:m })));
function findItem(id){ return FLAT.find(i => i.id === id); }
function isDone(it){
  if(it.type === 'lesson') return !!(data.completed && data.completed.includes(it.id));
  if(it.type === 'quiz') return !!(data.assignments && data.assignments[it.id] && data.assignments[it.id].passed);
  if(it.type === 'final') return !!(data.final && data.final.passed);
  return false;
}
function pctDone(){ return Math.round(FLAT.filter(isDone).length / FLAT.length * 100); }
function moduleProgress(m){ return { done:m.items.filter(isDone).length, total:m.items.length }; }
function allLessonsDone(){ return FLAT.filter(i => i.type==='lesson').every(isDone); }
function allAssignmentsPassed(){ return FLAT.filter(i => i.type==='quiz').every(isDone); }
function finalUnlocked(){ return allLessonsDone() && allAssignmentsPassed(); }
function certificateEarned(){ return !!(data.final && data.final.passed); }
function genCertId(){ return 'GM-' + Date.now().toString(36).toUpperCase().slice(-6) + Math.random().toString(36).toUpperCase().slice(2,6); }
function itemHref(it){ return '#/' + it.type + '/' + it.id; }
function itemIcon(it){
  if(it.type === 'quiz') return '📝';
  if(it.type === 'final') return '🏁';
  return VIDEOS.hasOwnProperty(it.id) ? '🎬' : '📖';
}

/* ---------- routing ---------- */
function go(hash){ location.hash = hash; }
function destroyTracking(){
  if(track){
    if(track.timer) clearTimeout(track.timer);
    if(track.observer) track.observer.disconnect();
    if(track.player && track.player.destroy){ try{ track.player.destroy(); }catch(e){} }
  }
  track = null;
}
function route(){
  destroyTracking();
  sidebar.classList.remove('open'); document.getElementById('backdrop').classList.remove('show');
  document.body.classList.toggle('unauth', !currentUser);
  if(!authReady){ main.innerHTML = '<div class="page" style="text-align:center;padding:60px 20px"><img class="auth-logo" src="'+LOGO+'" alt=""><p>Loading…</p></div>'; renderSidebar(); updateHeader(); return; }
  if(!currentUser){ renderAuth(); renderSidebar(); updateHeader(); return; }
  const parts = location.hash.replace(/^#\/?/, '').split('/');
  if(parts[0]==='lesson' && findItem(parts[1])) renderLesson(parts[1]);
  else if(parts[0]==='quiz' && QUIZZES[parts[1]]) renderTest('quiz', parts[1]);
  else if(parts[0]==='final') renderFinal();
  else if(parts[0]==='resources') renderResources();
  else if(parts[0]==='certificate') renderCertificate();
  else renderOverview();
  renderSidebar(); updateHeader();
  window.scrollTo({ top:0, behavior:'instant' });
}
window.addEventListener('hashchange', route);

    ${note}
    <div class="auth-tabs"><button type="button" class="${su?'':'on'}" onclick="setAuthMode('signin')">Sign in</button><button type="button" class="${su?'on':''}" onclick="setAuthMode('signup')">Create account</button></div>
    <form id="authForm" novalidate>
      ${su ? '<label for="fullname">Full name (shown on your certificate)</label><input id="fullname" name="fullname" autocomplete="name" placeholder="e.g. Ayesha Khan">' : ''}
      <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com">
      <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="${su?'new-password':'current-password'}" placeholder="At least 6 characters">
      <button class="btn btn-primary" type="submit">${su ? 'Create account' : 'Sign in'}</button>
      <div id="authMsg" role="alert"></div>
    </form>
    ${su ? '' : '<div class="auth-links"><a onclick="forgotPassword()">Forgot your password?</a></div>'}
  </div></div>`;
  document.getElementById('authForm').addEventListener('submit', submitAuth);
}
function setAuthMode(m){ authMode = m; renderAuth(); }
async function submitAuth(ev){
  ev.preventDefault();
  const f = ev.target, msg = document.getElementById('authMsg'), btn = f.querySelector('button[type=submit]');
  msg.className = ''; msg.textContent = '';
  const email = f.elements.email.value.trim(), pw = f.elements.password.value;
  const name = f.elements.fullname ? f.elements.fullname.value.trim() : '';
  if(!/^\S+@\S+\.\S+$/.test(email)){ msg.textContent = authMsg({ code:'auth/invalid-email' }); return; }
  if(authMode === 'signup' && name.length < 2){ msg.textContent = 'Please enter your full name — it will appear on your certificate.'; return; }
  if(pw.length < 6){ msg.textContent = authMsg({ code: authMode==='signup' ? 'auth/weak-password' : 'auth/invalid-credential' }); return; }
  btn.disabled = true;
  try{ if(authMode === 'signup') await Backend.signUp(name, email, pw); else await Backend.signIn(email, pw); }
  catch(e){ msg.textContent = authMsg(e); btn.disabled = false; }
}
async function forgotPassword(){
  const msg = document.getElementById('authMsg'), email = document.getElementById('email').value.trim();
  msg.className = ''; msg.textContent = '';
  if(!/^\S+@\S+\.\S+$/.test(email)){ msg.textContent = 'Type your email above first, then click "Forgot your password?".'; return; }
  try{ await Backend.reset(email); msg.className = 'ok'; msg.textContent = 'If an account exists for that email, a reset link is on its way.'; }
  catch(e){ msg.textContent = authMsg(e); }
}

/* ---------- video (plays inside the course via the YouTube player API) ---------- */
function resolveVideoId(v){
  if(!v) return null;
  v = String(v).trim();
  if(/^[a-zA-Z0-9_-]{11}$/.test(v)) return v;
  const m = v.match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}
function videoBlock(lesson, vid){
  if(vid) return `<div class="video-wrap"><div id="ytPlayer"></div></div><div class="video-note" id="videoNote" hidden></div>`;
  return `<div class="video-wrap vph"><div class="vph-inner">
    <div class="vph-icon">▶</div>
    <div><strong>${lesson.title} — video</strong><span>This lesson's video is coming soon. The full written lesson is below — nothing is blocked while you wait.</span></div>
  </div></div>`;
}
let ytPromise = null;
function loadYT(){
  if(window.YT && window.YT.Player) return Promise.resolve();
  if(!ytPromise){
    ytPromise = new Promise((res, rej) => {
      const prev = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = () => { if(prev) prev(); res(); };
      const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.onerror = () => rej(new Error('yt load'));
      document.head.appendChild(s);
      setTimeout(() => rej(new Error('yt timeout')), 12000);
    });
  }
  return ytPromise;
}
function videoProblem(id, why){
  if(!track || track.id !== id) return;
  track.videoWaived = true;
  const n = document.getElementById('videoNote');
  if(n){ n.hidden = false; n.innerHTML = '⚠️ This video could not be played inside the course (' + why + '). It will not block your progress. ' + '<a href="https://www.youtube.com/watch?v=' + track.vid + '" target="_blank" rel="noopener">Watch it on YouTube</a>.'; }
  refreshHint(); checkComplete();
}
function mountVideo(id, vid){
  loadYT().then(() => {
    if(!track || track.id !== id) return;
    const vars = { rel:0, playsinline:1 };
    if(/^https?:$/.test(location.protocol)) vars.origin = location.origin;
    track.player = new YT.Player('ytPlayer', {
      videoId:vid, width:'100%', height:'100%', playerVars:vars,
      events:{
        onStateChange: e => { if(e.data === 0 && track && track.id === id){ track.videoDone = true; refreshHint(); checkComplete(); } },
        onError: () => videoProblem(id, 'embedding may be switched off for this video in YouTube Studio')
      }
    });
  }).catch(() => videoProblem(id, 'YouTube could not be reached'));
}
