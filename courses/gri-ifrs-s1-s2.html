/* ---------- views: lesson (progress is tracked automatically) ---------- */
let track = null;
function renderLesson(id){
  const item = findItem(id), done = isDone(item);
  const hasSlot = VIDEOS.hasOwnProperty(item.id);
  const vid = hasSlot ? resolveVideoId(VIDEOS[item.id]) : null;
  const res = RESOURCES[item.id];
  main.innerHTML = `<div class="page">
    <div class="crumbs">${item.module.name}</div>
    <h1 class="pagetitle">${item.title}</h1>
    <div class="metas"><span class="chip">⏱ ${item.minutes} min</span><span class="chip">${hasSlot?'🎬 Video + written lesson':'📖 Written lesson'}</span><span class="chip" id="doneChip" ${done?'':'hidden'}>✅ Completed</span></div>
    <div class="trackhint" id="trackHint"></div>
    ${hasSlot ? videoBlock(item, vid) : ''}
    <article class="lesson-body">${item.html}</article>
    <div class="takeaway"><b>🔑 Key takeaway — </b>${item.takeaway}</div>
    ${res ? `<div class="res-card"><div class="res-ic">📥</div><div style="flex:1"><h4>${res.title}</h4><p>${res.desc}</p>
        <div class="res-btns">
          <button class="btn btn-primary btn-sm" onclick="dlRes('${item.id}')">⬇ Download</button>
          <button class="btn btn-ghost btn-sm" onclick="openRes('${item.id}')">🖨 Open & print</button>
        </div></div></div>` : ''}
    <div id="endSentinel" style="height:1px"></div>
    ${prevNextButtons(item)}
  </div>`;
  startTracking(item, vid);
}
function startTracking(item, vid){
  const done = isDone(item);
  track = { id:item.id, vid, done, seen:false, timeOk:false, needVideo:!!vid && !done, videoDone:false, videoWaived:false, player:null, observer:null, timer:null };
  if(vid) mountVideo(item.id, vid);
  if(!done){
    const id = item.id;
    track.timer = setTimeout(() => { if(track && track.id === id){ track.timeOk = true; refreshHint(); checkComplete(); } }, MIN_SECONDS_ON_LESSON * 1000);
    const s = document.getElementById('endSentinel');
    if('IntersectionObserver' in window && s){
      track.observer = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting && track && track.id === id){ track.seen = true; refreshHint(); checkComplete(); } }));
      track.observer.observe(s);
    } else { track.seen = true; }
  }
  refreshHint();
}
function refreshHint(){
  const el = document.getElementById('trackHint');
  if(!el || !track) return;
  if(track.done){ el.className = 'trackhint ok'; el.innerHTML = '✅ Lesson completed — your progress is saved automatically.'; return; }
  const parts = [];
  if(track.needVideo){ const y = track.videoDone || track.videoWaived; parts.push(`<span class="th ${y?'y':''}">${y?'✓':'○'} Watch the video to the end</span>`); }
  const y2 = track.seen && track.timeOk;
  parts.push(`<span class="th ${y2?'y':''}">${y2?'✓':'○'} Read to the end of the lesson</span>`);
  el.className = 'trackhint';
  el.innerHTML = '<b>This lesson completes automatically:</b> ' + parts.join(' ');
}
function checkComplete(){
  if(!track || track.done) return;
  const pageOk = track.seen && track.timeOk;
  const videoOk = !track.needVideo || track.videoDone || track.videoWaived;
  if(pageOk && videoOk) finishLesson(track.id);
}
function finishLesson(id){
  if(!data.completed) data.completed = [];
  if(!data.completed.includes(id)) data.completed.push(id);
  track.done = true;
  persist(); refreshHint();
  const c = document.getElementById('doneChip'); if(c) c.hidden = false;
  renderSidebar(); updateHeader();
  toast('✓ Lesson completed');
}

/* ---------- views: assignments & final assessment (all multiple choice) ---------- */
let tState = null;
function renderTest(kind, id){
  if(kind === 'final') id = 'final';
  const def = kind === 'final' ? FINAL : QUIZZES[id];
  let qs = def.questions.map(q => ({ q:q.q, options:q.options.slice(), answer:q.answer, why:q.why, mod:q.mod }));
  if(def.shuffle){
    shuffle(qs);
    qs = qs.map(q => { const idx = shuffle(q.options.map((_, i) => i)); return { ...q, options:idx.map(i => q.options[i]), answer:idx.indexOf(q.answer) }; });
  }
  tState = { kind, id, def, qs };
  const qhtml = qs.map((q, i) => `<div class="qcard" id="qc${i}"><div class="qnum">Question ${i+1} of ${qs.length}</div><div class="qtext">${q.q}</div>` +
    q.options.map((o, j) => `<label class="opt" id="opt${i}_${j}"><input type="radio" name="q${i}" value="${j}"><span class="letter">${String.fromCharCode(65+j)}</span><span>${o}</span></label>`).join('') +
    `<div class="qwhy" id="why${i}" hidden></div></div>`).join('');
  const isFinal = kind === 'final';
  const idx = FLAT.findIndex(i => i.id === id);
  const prevBest = isFinal ? (data.final && data.final.best != null ? data.final.best + ' / ' + data.final.total : null)
                           : (data.assignments && data.assignments[id] ? data.assignments[id].score + ' / ' + data.assignments[id].total : null);
  main.innerHTML = `<div class="page">
    <div class="crumbs">${isFinal ? 'Final Assessment' : 'Module ' + def.afterModule + ' assignment'}</div>
    <h1 class="pagetitle">${def.title}</h1>
    <div class="metas"><span class="chip">📝 ${qs.length} multiple-choice questions</span><span class="chip">🎯 Pass mark: ${def.passMark}%</span><span class="chip">🔁 Retake anytime — best score saved</span>${prevBest ? `<span class="chip">Best so far: ${prevBest}</span>` : ''}</div>
    <p>${isFinal
      ? 'Choose one answer for every question, then press <strong>Submit</strong>. Questions and answer options are shuffled on every attempt. You need <strong>' + def.passMark + '%</strong> (' + Math.ceil(qs.length * def.passMark / 100) + ' of ' + qs.length + ') to unlock your certificate. You can retake the assessment as many times as you need.'
      : 'Choose one answer for every question, then press <strong>Submit</strong>. Answers are graded instantly and every question is explained afterwards.'}</p>
    <div class="ansbar"><span id="ansCount">0 / ${qs.length} answered</span><div class="bar"><i id="ansFill"></i></div></div>
    <div id="quizMsg" hidden>Please answer every question before submitting — unanswered questions are highlighted in red.</div>
    <form id="quizForm" onsubmit="return false">${qhtml}</form>
    <div style="margin-top:18px"><button class="btn btn-primary" id="submitQuiz">Submit ${isFinal ? 'assessment' : 'assignment'}</button></div>
    <div class="results" id="quizResults" hidden></div>
    ${prevNextButtons({ id })}
  </div>`;
  document.getElementById('quizForm').addEventListener('change', e => {
    const card = e.target.closest('.qcard'); if(card) card.classList.remove('miss');
    const n = qs.filter((_, i) => document.querySelector('input[name="q'+i+'"]:checked')).length;
    document.getElementById('ansCount').textContent = n + ' / ' + qs.length + ' answered';
    document.getElementById('ansFill').style.width = Math.round(n / qs.length * 100) + '%';
  });
  document.getElementById('submitQuiz').onclick = gradeTest;
}
function gradeTest(){
  const { kind, id, def, qs } = tState;
  const unanswered = [];
  qs.forEach((q, i) => { if(!document.querySelector('input[name="q'+i+'"]:checked')) unanswered.push(i); });
  if(unanswered.length){
    document.getElementById('quizMsg').hidden = false;
    unanswered.forEach(i => document.getElementById('qc'+i).classList.add('miss'));
    document.getElementById('qc'+unanswered[0]).scrollIntoView({ behavior:'smooth', block:'center' });
    return;
  }
  document.getElementById('quizMsg').hidden = true;
  let score = 0; const byMod = {};
  qs.forEach((q, i) => {
    const chosen = parseInt(document.querySelector('input[name="q'+i+'"]:checked').value);
    const ok = chosen === q.answer;
    if(ok) score++;
    document.getElementById('opt'+i+'_'+q.answer).classList.add('right');
    if(!ok) document.getElementById('opt'+i+'_'+chosen).classList.add('wrong');
    document.querySelectorAll('input[name="q'+i+'"]').forEach(r => r.disabled = true);
    const why = document.getElementById('why'+i); why.hidden = false;
    why.innerHTML = '<b>' + (ok ? '✅ Correct. ' : '❌ Not quite. ') + '</b>' + (q.why || '');
    if(q.mod){ byMod[q.mod] = byMod[q.mod] || { s:0, t:0 }; byMod[q.mod].t++; if(ok) byMod[q.mod].s++; }
  });
  document.getElementById('submitQuiz').disabled = true;
  const total = qs.length, pct = Math.round(score / total * 100), passed = pct >= def.passMark;
  let firstPass = false;
  if(kind === 'final'){
    const f = data.final || { attempts:0 };
    f.attempts = (f.attempts || 0) + 1; f.total = total; f.best = Math.max(score, f.best || 0);
    if(passed && !f.passed){ f.passed = true; f.passedOn = new Date().toISOString(); f.passScore = score; f.certId = genCertId(); firstPass = true; }
    data.final = f;
  } else {
    data.assignments = data.assignments || {};
    const prev = data.assignments[id] || {};
    data.assignments[id] = { score:Math.max(score, prev.score || 0), total, passed: !!prev.passed || passed };
  }
  persist(); renderSidebar(); updateHeader();
  const prevPassed = kind === 'final' ? (data.final.passed && !firstPass) : false;
  const box = document.getElementById('quizResults');
  box.hidden = false; box.className = 'results ' + (passed ? 'pass' : 'fail');
  const modNames = {}; COURSE.modules.forEach(m => modNames[m.id] = m.name.replace(/^Module \d+ — /, ''));
  const breakdown = kind === 'final' ? '<div class="modbreak">' + Object.keys(byMod).map(k => `<div><span>${modNames[k]}</span><b>${byMod[k].s}/${byMod[k].t}</b></div>`).join('') + '</div>' : '';
  let actions;
  if(kind === 'final'){
    actions = passed
      ? `<a class="btn btn-primary" href="#/certificate">🎓 View your certificate</a><button class="btn btn-ghost" onclick="renderTest('final')">🔁 Retake</button>`
      : `<button class="btn btn-primary" onclick="renderTest('final')">🔁 Retake the assessment</button><a class="btn btn-ghost" href="#/">Review the course</a>`;
  } else {
    actions = `<button class="btn btn-ghost" onclick="renderTest('quiz','${id}')">🔁 Retake</button><button class="btn btn-primary" onclick="goToNext({id:'${id}'})">${passed ? 'Continue →' : 'Skip for now →'}</button>`;
  }
  box.innerHTML = `<div class="scorebig">${pct}%</div>
    <div style="font-weight:700;margin-top:4px">${passed ? (kind==='final' ? '🎉 You passed the Final Assessment — your certificate is unlocked.' : '🎉 Passed! Nicely done.') : 'Not quite — you need ' + def.passMark + '% to pass. You can retake it right now; your best score is saved.'}</div>
    <div style="font-size:13.5px;color:var(--mut);margin-top:4px">Score: ${score} / ${total} · Pass mark: ${def.passMark}%${prevPassed ? ' · ✅ You have already passed this' : ''}</div>
    ${breakdown}<div class="rbtns">${actions}</div>`;
  box.scrollIntoView({ behavior:'smooth', block:'center' });
}
function renderFinal(){
  if(!finalUnlocked() && !certificateEarned()){
    const remaining = FLAT.filter(i => (i.type==='lesson' || i.type==='quiz') && !isDone(i));
    const first = remaining[0];
    main.innerHTML = `<div class="page">
      <div class="crumbs">Final Assessment</div>
      <h1 class="pagetitle">🔒 Final Assessment — locked</h1>
      <div class="lockbox"><h3>Finish the course first</h3><p style="margin:0">The Final Assessment (40 multiple-choice questions, 70% to pass) unlocks once every lesson is complete and every module assignment is passed.</p></div>
      ${remaining.map(i => `<div class="chk-row bad"><span class="box"></span><span>${i.type==='quiz' ? '📝 ' : ''}${i.title}</span></div>`).join('')}
      <a class="btn btn-primary" style="margin-top:14px" href="${itemHref(first)}">▶ Pick up where you left off</a>
    </div>`;
    return;
  }
  renderTest('final', 'final');
}

<h2>Part C — Compare</h2>
<p>For each issue you identified: GRI material? IFRS S1/S2 material? Both? Why? Use the Framework Comparison Sheet from Lesson 1.1 to justify your reasoning.</p>

};

function dlRes(id){
  const r = RESOURCES[id];
  const blob = new Blob([r.build()], { type:'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = r.file;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function openRes(id){
  const blob = new Blob([RESOURCES[id].build()], { type:'text/html' });
  window.open(URL.createObjectURL(blob), '_blank');
}
function renderResources(){
  main.innerHTML = `<div class="page">
    <div class="crumbs">Toolkit</div>
    <h1 class="pagetitle">All Resources</h1>
    <p style="margin:8px 0 16px">Every lesson has its own downloadable resource, listed here in course order for convenience. Everything is generated right in your browser.</p>
    ${FLAT.filter(i => RESOURCES[i.id]).map(i => {
      const r = RESOURCES[i.id];
      return `<div class="res-card"><div class="res-ic">📥</div><div style="flex:1">
        <h4>${r.title}</h4><p>${r.desc}</p>
        <div class="res-btns">
          <button class="btn btn-primary btn-sm" onclick="dlRes('${i.id}')">⬇ Download</button>
          <button class="btn btn-ghost btn-sm" onclick="openRes('${i.id}')">🖨 Open & print</button>
          <a class="btn btn-ghost btn-sm" href="#/lesson/${i.id}">Go to lesson →</a>
        </div></div></div>`;
    }).join('')}
  </div>`;
}

/* ---------- views: certificate ---------- */
function certHTML(o){
  return `<div class="cert-card ${o.sample?'sample':''}" id="certCard">
    <img class="cert-wm" src="${LOGO}" alt="">
    <div class="cert-inner">
      <img class="cert-logo" src="${LOGO}" alt="GreenMetrics">
      <div class="cbrand">GreenMetrics</div>
      <div class="ctag">ESG · Data · Impact</div>
      <h2>Certificate of Completion</h2>
      <p class="cline">This certifies that</p>
      <div class="cname">${esc(o.name)}</div>
      <p class="cline">has successfully completed the course</p>
      <p class="ctitle">Understanding GRI &amp; IFRS S1/S2</p>
      <p class="cline">A Practical Introduction to Sustainability Reporting</p>
      <p class="cline">and passed the Final Assessment with a score of <b>${o.score}%</b></p>
      <div class="cmeta"><div>Date of completion<b>${o.date}</b></div><div>Certificate ID<b>${o.id}</b></div></div>
    </div>
    ${o.sample ? '<div class="cert-stamp">SAMPLE</div>' : ''}
  </div>`;
}
function renderCertificate(){
  if(!certificateEarned()){
    const f = data.final;
    main.innerHTML = `<div class="page">
      <div class="crumbs">Toolkit</div>
      <h1 class="pagetitle">🔒 Certificate — locked</h1>
      <div class="lockbox"><h3>Pass the Final Assessment with 70% or above</h3>
        <p style="margin:0">Your personalised certificate — with your name, the GreenMetrics logo and watermark — unlocks as soon as you pass.${f && f.best != null ? ' Your best score so far: <b>' + f.best + ' / ' + f.total + '</b>.' : ''}</p></div>
      <a class="btn btn-primary" href="#/final/final">${finalUnlocked() ? '🏁 Go to the Final Assessment' : '🏁 See what is left before the Final Assessment'}</a>
      <h3 style="margin:26px 0 4px;font-size:16px">Sample preview</h3>
      <p class="mut" style="font-size:13.5px;margin-bottom:0">This is how your certificate will look.</p>
      ${certHTML({ name:'Your Name Here', score:'85', date:'Date of completion', id:'GM-XXXXXX', sample:true })}
    </div>`;
    return;
  }
  const f = data.final;
  const date = new Date(f.passedOn).toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' });
  const score = Math.round((f.passScore != null ? f.passScore : f.best) / f.total * 100);
  const name = data.certName || data.name || currentUser.name;
  main.innerHTML = `<div class="page">
    <div class="crumbs no-print">Toolkit</div>
    <h1 class="pagetitle no-print">🎓 Your Certificate of Completion</h1>
    <p class="no-print" style="margin:8px 0 14px">Congratulations — you passed the Final Assessment. Check that your name is spelled the way you want it on the certificate, then print or save it as a PDF.</p>
    <div class="no-print" style="margin:0 0 6px">
      <input class="name-input" id="certName" placeholder="Name on certificate" value="${esc(name)}">
      <button class="btn btn-primary" style="margin-left:8px" onclick="window.print()">🖨 Print / Save as PDF</button>
    </div>
    ${certHTML({ name, score, date, id:f.certId || '—', sample:false })}
  </div>`;
  document.getElementById('certName').addEventListener('input', function(){
    data.certName = this.value; persist();
    document.querySelector('.cert-card .cname').textContent = this.value || 'Your Name';
  });
}

</script>
