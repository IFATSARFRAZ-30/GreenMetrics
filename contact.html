<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — GreenMetrics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A41; --ink-soft:#3A4A63; --paper:#EFE6D8; --paper-deep:#E4D8C4;
    --stamp:#B5482B; --sage:#5F7156; --line:#C9BBA1; --white:#FBF8F2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper-deep);color:var(--ink);font-family:'Source Serif 4', Georgia, serif;}
  a{color:inherit;}
  .sheet{max-width:900px;margin:40px auto;background:var(--paper);border:1px solid var(--line);position:relative;box-shadow:0 2px 0 var(--line), 0 24px 60px -30px rgba(27,42,65,0.45);}
  .sheet::before{content:"";position:absolute;inset:10px;border:1px solid var(--ink);opacity:0.15;pointer-events:none;}

  nav.tabs{display:flex;flex-wrap:wrap;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);background:var(--white);}
  nav.tabs a{flex:1 1 auto;text-align:center;padding:14px 10px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.05em;text-transform:uppercase;text-decoration:none;color:var(--ink-soft);border-right:1px solid var(--line);}
  nav.tabs a:last-child{border-right:none;}
  nav.tabs a.active{background:var(--ink);color:var(--white);}
  nav.tabs a:hover:not(.active){background:var(--paper);color:var(--ink);}

  .content{padding:70px 56px;text-align:center;}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(26px,4vw,34px);margin:0 0 14px;}
  .content p{font-size:15px;line-height:1.65;color:var(--ink-soft);max-width:50ch;margin:0 auto 28px;}
  .btn{font-family:'IBM Plex Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:12px 22px;border:1px solid var(--ink);background:var(--ink);color:var(--white);text-decoration:none;display:inline-block;}

  footer{padding:34px 56px 44px;background:var(--ink);color:var(--white);}
  footer .brand{font-family:'Fraunces',serif;font-weight:600;font-size:20px;}
  footer p{font-family:'IBM Plex Mono',monospace;font-size:11.5px;line-height:1.7;color:#C9BBA1;max-width:70ch;margin:10px 0 0;}

  @media (max-width:640px){
    .content{padding:50px 22px;} footer{padding:28px 22px 34px;}
    nav.tabs a{padding:12px 6px;font-size:10.5px;}
  }
</style>
</head>
<body>
<div class="sheet">

  <nav class="tabs">
    <a href="index.html">Home</a>
    <a href="articles.html">Articles</a>
    <a href="tools/index.html">Free tools</a>
    <a href="paid.html">Paid guides</a>
    <a href="about.html">About Me</a>
    <a class="active" href="contact.html">Contact</a>
  </nav>

  <div class="content">
    <h1>Contact — coming soon</h1>
    <p>A contact form is on its way. In the meantime, reach out through GreenMetrics' social channels.</p>
    <a class="btn" href="index.html">Back to home</a>
  </div>

  <footer>
    <div class="brand">GreenMetrics</div>
    <p>GreenMetrics is Ifat Sarfraz's sustainability reporting and assurance practice.</p>
  </footer>

</div>
</body>
</html>
